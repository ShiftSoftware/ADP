 - script: dotnet pack ADP.Surveys/ADP.Surveys.Data --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.Surveys.Data'

 - script: dotnet pack ADP.Surveys/ADP.Surveys.API --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.Surveys.API'

 - script: dotnet pack ADP.Surveys/ADP.Surveys.Web --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.Surveys.Web'

