trigger:
 tags:
    include:
    - release-nuget-*

pool:
  vmImage: ubuntu-22.04
  
variables:
- group: pipeline

steps:

 - checkout: self
   submodules: true
   persistCredentials: true

 - script: dotnet build --configuration release
   displayName: 'Build All Projects'

 - script: dotnet pack ADP.Models/Models --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget')) 
   displayName: 'pack ADP.Models'

# Packed before ADP.LookupServices, which depends on it: the vehicle lookup calls the shared menu-code
# generator so its menu codes cannot drift from the DMS export's. Ordering is cosmetic for the pack itself
# (every project is already built, and all packages are pushed in one step) but keeps the dependency
# readable — the same reason ADP.Models comes first.
 - script: dotnet pack ADP.Menus/ADP.Menus.Generation --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.Menus.Generation'

 - script: dotnet pack ADP.LookupServices/Lookup.Services --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.LookupServices'

 - script: dotnet pack ADP.LookupServices/Lookup.Services.DuckDB --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.LookupServices.DuckDB'

 - script: dotnet pack ADP.SyncAgent/SyncAgent --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.SyncAgent'

 - script: dotnet pack ADP.Rastgo/Rastgo --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.Rastgo'

 - script: dotnet pack ADP.Hawta/Hawta --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
