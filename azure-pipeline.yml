   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.ClaimableItems.Data'

 - script: dotnet pack ADP.ClaimableItems/ADP.ClaimableItems.API --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.ClaimableItems.API'

