 - script: dotnet pack ADP.Cases/ADP.Cases.Data --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.Cases.Data'

 - script: dotnet pack ADP.WarrantyClaims/ADP.WarrantyClaims.Shared --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.WarrantyClaims.Shared'

 - script: dotnet pack ADP.WarrantyClaims/ADP.WarrantyClaims.Data --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
   displayName: 'pack ADP.WarrantyClaims.Data'

 - script: dotnet pack ADP.WarrantyClaims/ADP.WarrantyClaims.API --configuration Release --output $(Build.ArtifactStagingDirectory)/ADP
   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-nuget'))
