<text x="18" y="772" font-size="13.5" font-weight="700" fill="#121922" text-anchor="start">Dealer website</text>
<text x="18" y="792" font-size="11.5" font-weight="400" fill="#4c5964" text-anchor="start">service booking, part search</text>
<path d="M480 643 C480 692 359 692 359 734" fill="none" stroke="#5b6672" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="246" y="744" width="226" height="68" rx="12" fill="#ffffff" stroke="#dde4ec"/>
<text x="260" y="772" font-size="13.5" font-weight="700" fill="#121922" text-anchor="start">Distributor portal</text>
<text x="260" y="792" font-size="11.5" font-weight="400" fill="#4c5964" text-anchor="start">warranty desk, dealer network</text>
<path d="M480 643 C480 692 601 692 601 734" fill="none" stroke="#5b6672" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="488" y="744" width="226" height="68" rx="12" fill="#ffffff" stroke="#dde4ec"/>
<text x="502" y="772" font-size="13.5" font-weight="700" fill="#121922" text-anchor="start">Showroom &amp; service kiosk</text>
<text x="502" y="792" font-size="11.5" font-weight="400" fill="#4c5964" text-anchor="start">a plate, a screen, a result</text>
<path d="M480 643 C480 692 843 692 843 734" fill="none" stroke="#5b6672" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="730" y="744" width="226" height="68" rx="12" fill="#ffffff" stroke="#dde4ec"/>
<text x="744" y="772" font-size="13.5" font-weight="700" fill="#121922" text-anchor="start">Any page you already have</text>
<text x="744" y="792" font-size="11.5" font-weight="400" fill="#4c5964" text-anchor="start">no build step, no framework</text>
<text x="496" y="658" font-size="10.5" font-weight="700" fill="#7a5d08" text-anchor="start" letter-spacing="0.3">embed</text>
<text x="542" y="658" font-size="11.5" font-weight="400" fill="#4c5964" text-anchor="start">one tag, one element, one method call</text>
</svg>
