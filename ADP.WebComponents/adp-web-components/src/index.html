<!doctype html>
<!--
  Landing page for adp-web-components.

  Section order: what is this (hero) → what is in it (components) → what does it
  do and what do I do (overview) → where does it sit → show me a working embed →
  how do I install it → what will bite me → what else do I get → where next.

  The sections alternate bg-base-100 / bg-base-200 so each seam is visible. The
  hero is not in the alternation — it is .wash over the body's bg-base-200 — so
  the section after it has to be bg-base-100, and every section below inherits its
  colour from its POSITION, not from its content. Reorder them and the whole run
  has to be re-alternated, cards and figcaptions with it.

  Two things here are generated and must stay that way:

    templates/catalog.json   which demo pages exist, per component group
    build-info.json          which PUBLISHED version the site was built against

  package.json is the version being prepared, which is routinely ahead of what
  anyone can install, so every snippet uses the build stamp and only falls back to
  the catalog in dev, where no stamp exists.

  Copy is in templates/site-locales.js, in four languages. Nothing user-visible is
  written in this file — a literal string here is a string that cannot be
  translated. Icon geometry, illustrations and snippet shapes do live here,
  because none of them are words. Syntax highlighting used to as well; it moved to
  templates/highlight.js once a second page needed it.

  Unlike a harness page, this one has no component under test, so R1 does not
  apply: this is the surface itself, and it is allowed to be expressive.
-->
<html lang="en" dir="ltr" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>ADP web components — embed platform lookups and forms</title>
    <meta
      name="description"
      content="Ready-to-embed custom elements that render Automotive Dealer Platform vehicle, part and service data on any page. One module tag, no framework, no build step."
    />

    <!--
      Static, in English, on purpose. The page body is rendered by Alpine, and a
      link-preview scraper does not execute JavaScript — so these tags are the
      only thing a paste into a chat client ever sees.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ADP web components" />
    <meta property="og:description" content="Ready-to-embed custom elements that render Automotive Dealer Platform vehicle, part and service data on any page." />
    <meta property="og:image" content="templates/assets/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ADP web components" />
    <meta name="twitter:description" content="Ready-to-embed custom elements that render Automotive Dealer Platform vehicle, part and service data on any page." />

    <link rel="icon" href="/templates/assets/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1016" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Both blocking on purpose: theme and text direction are decided before the
         first paint, or the page visibly jumps on every load. -->
    <script src="/templates/harness-theme.js"></script>
    <script src="/templates/site-locales.js"></script>

    <!--
      The syntax highlighter and the top bar, both of which the documentation
      pages load too. Each hangs itself on window rather than being imported
      where it is used, because the page script at the bottom of this file is a
      CLASSIC script: that one has to define landing() while the document
      parses, before the deferred Alpine bundle walks the DOM and resolves
      x-data. A module is always deferred, so the same code down there would run
      after Alpine.

      Relative specifiers, not "/templates/…": this page is always the site
      root, so they resolve at any mount without the release build having to
      rewrite them — and unlike a src= attribute, an import specifier is not
      something that build rewrites.

      This block stays ahead of the Alpine tag on purpose. Deferred scripts and
      module scripts share one queue and run in document order, so it is
      finished before Alpine starts — which is also what lets mountSiteHeader()
      stamp the header into a DOM Alpine has not walked yet.

      alpineScope: false because landing() already covers the header. It drives
      the body from the same catalog, and the :inert on <main> and <footer>
      reads the header's own `mobile`, so a second nested scope would shadow it.
    -->
    <script type="module">
      import { highlight } from './templates/highlight.js';
      import { mountSiteHeader } from './templates/site-header.js';

      window.adpHighlight = highlight;

      mountSiteHeader({ alpineScope: false });
    </script>

    <script defer src="/templates/vendor/alpine.js"></script>
  </head>

  <body class="bg-base-200 text-base-content min-h-screen">
    <!--
      No x-cloak on this wrapper. [x-cloak] is display:none !important, so putting
      it here meant the entire page rendered zero pixels and zero characters until
      Alpine booted — a blank screen for anyone whose script is blocked, proxied
      away or simply slow, and for every crawler that does not run JS. It belongs
      only on the things that would genuinely flash: the popups and the sheet.
    -->
    <div x-data="landing()" @keydown.escape.window="open = null; mobile = false">
      <a href="#main" class="btn btn-primary sr-only focus:not-sr-only focus:absolute focus:start-3 focus:top-3 focus:z-50" x-text="t('skip')"></a>

      <!-- ═══════════════════════════ top bar ═══════════════════════════ -->
      <div data-site-header>
        <!--
          Placeholder. templates/site-header.js replaces this element outright —
          this comment with it — and stamps the top bar and the mobile sheet that
          belongs to it in its place, so nothing of the mount survives in the
          rendered page.

          The markup used to sit here. It moved because a second documentation
          page needs the same navigation, and two copies of a navigation are two
          navigations: they drift, and the one nobody is looking at drifts first.

          Mounted from the module block in <head>, which is deferred and so has
          finished before Alpine walks the DOM.
        -->
      </div>

      <main id="main" tabindex="-1" :inert="mobile">
        <!-- ═══════════════════════════ 1 · hero ═══════════════════════════ -->
        <section class="wash border-base-300 relative overflow-hidden border-b [--wash-reach:100%]">
          <!--
            The wordmark as a letterhead. The alpha is a theme token because gold
            at one value behaves completely differently over the two grounds: 15%
            measured 1.07:1 on light (a whisper, as intended) and 1.40:1 on dark —
            a solid olive object reading as a failed image load.
          -->
          <span
            class="adp-logo pointer-events-none absolute -top-10 end-[-6rem] w-[560px] text-[color-mix(in_srgb,var(--color-primary)_var(--watermark-strength),transparent)] sm:w-[720px]"
            aria-hidden="true"
          ></span>

          <div
            class="relative mx-auto grid w-full max-w-[1240px] gap-12 px-5 py-16 sm:px-8 sm:py-24 lg:grid-cols-[minmax(0,1.05fr)_minmax(0,1fr)] lg:items-center lg:gap-16 lg:py-28"
          >
            <div>
              <p class="eyebrow text-accent rise font-bold" x-text="t('hero.eyebrow')"></p>
              <h1 class="rise rise-2 mt-5 text-[2.6rem] leading-[var(--leading-display)] font-bold tracking-tight sm:text-6xl" x-text="t('hero.title')"></h1>
              <p class="lede text-base-content/70 rise rise-3 mt-6 text-lg leading-relaxed sm:text-xl" x-text="t('hero.lede')"></p>

              <div class="rise rise-4 mt-9 flex flex-wrap items-center gap-3">
                <a href="#quickstart" class="btn btn-primary btn-lg" x-text="t('hero.primary')"></a>
                <a href="#install" class="btn btn-outline btn-lg" x-text="t('hero.secondary')"></a>
              </div>

              <dl class="border-base-300 rise rise-4 mt-10 flex flex-wrap items-center gap-x-8 gap-y-3 border-t pt-6">
                <div class="flex items-baseline gap-2">
                  <dt class="text-base-content/70 text-sm" x-text="t('hero.package')"></dt>
                  <dd class="font-mono text-sm font-semibold" x-text="packageName"></dd>
                </div>
                <div class="flex items-baseline gap-2">
                  <dt class="text-base-content/70 text-sm" x-text="t('hero.version')"></dt>
                  <dd class="font-mono text-sm font-semibold" x-text="version ? 'v' + version : '—'"></dd>
                </div>
                <a
                  class="link link-hover text-accent inline-flex min-h-6 items-center gap-1.5 text-sm font-medium"
                  :href="'https://www.npmjs.com/package/' + packageName + '?activeTab=versions'"
                  target="_blank"
                  rel="noreferrer"
                >
                  <span x-text="t('hero.registry')"></span>
                  <span class="rtl:-scale-x-100" aria-hidden="true">→</span>
                </a>
              </dl>
            </div>

            <!-- Your page, one element, what it renders. Every colour is a theme
                 token through currentColor, so it inverts with the theme. -->
            <svg viewBox="0 0 480 320" fill="none" class="rise rise-4 h-auto w-full max-w-[560px] justify-self-center" aria-hidden="true">
              <rect x="1" y="1" width="478" height="318" rx="20" class="text-base-300" stroke="currentColor" stroke-width="2" />
              <path d="M1 45h478" class="text-base-300" stroke="currentColor" stroke-width="2" />
              <circle cx="30" cy="23" r="5" class="text-base-300" fill="currentColor" />
              <circle cx="50" cy="23" r="5" class="text-base-300" fill="currentColor" />
              <circle cx="70" cy="23" r="5" class="text-base-300" fill="currentColor" />
              <rect x="96" y="15" width="150" height="16" rx="8" class="text-base-300" fill="currentColor" />
              <g class="text-base-content/20" fill="currentColor">
                <rect x="32" y="76" width="120" height="10" rx="5" />
                <rect x="32" y="98" width="88" height="10" rx="5" />
                <rect x="32" y="252" width="140" height="10" rx="5" />
                <rect x="32" y="274" width="104" height="10" rx="5" />
              </g>
              <path
                d="M64 150l-16 16 16 16M104 150l16 16-16 16M92 144l-16 44"
                class="text-accent"
                stroke="currentColor"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <g class="rtl:-scale-x-100" style="transform-origin: 163px 166px">
                <path d="M140 166h44" class="text-accent" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9" />
                <path d="M186 158l12 8-12 8z" class="text-accent" fill="currentColor" />
              </g>
              <rect x="216" y="112" width="232" height="140" rx="14" class="text-base-300" stroke="currentColor" stroke-width="2" />
              <path d="M216 126a14 14 0 0 1 14-14h204a14 14 0 0 1 14 14v20H216z" class="text-primary" fill="currentColor" />
              <path d="M216 146h232" class="text-base-300" stroke="currentColor" stroke-width="2" />
              <rect x="232" y="122" width="96" height="14" rx="7" class="text-primary-content" fill="currentColor" opacity=".8" />
              <g class="text-base-content/35" fill="currentColor">
                <rect x="232" y="164" width="60" height="9" rx="4.5" />
                <rect x="232" y="192" width="60" height="9" rx="4.5" />
                <rect x="232" y="220" width="60" height="9" rx="4.5" />
              </g>
              <g class="text-base-content/55" fill="currentColor">
                <rect x="320" y="164" width="112" height="9" rx="4.5" />
                <rect x="320" y="192" width="84" height="9" rx="4.5" />
                <rect x="320" y="220" width="100" height="9" rx="4.5" />
              </g>
            </svg>
          </div>
        </section>

        <!-- ═══════════════════════════ 2 · components ═══════════════════════════ -->
        <section id="components" class="bg-base-100 border-base-300 scroll-mt-20 border-b">
          <div class="mx-auto max-w-[1240px] px-5 py-20 sm:px-8 sm:py-24">
            <h2 class="text-[1.75rem] leading-[var(--leading-heading)] font-bold tracking-tight sm:text-3xl" x-text="t('components.title')"></h2>
            <p class="lede text-base-content/70 mt-4 text-lg" x-text="t('components.lede')"></p>

            <ul class="mt-12 grid gap-5 md:grid-cols-3">
              <template x-for="group in groups" :key="group.id">
                <li class="card bg-base-200 border-base-300 flex flex-col border p-6">
                  <svg viewBox="0 0 260 96" fill="none" class="mb-5 h-auto w-full" aria-hidden="true" x-html="groupIllustration(group.id)"></svg>

                  <div class="flex items-start justify-between gap-3">
                    <p class="text-lg font-semibold" x-text="group.label"></p>
                    <span
                      class="badge badge-sm shrink-0"
                      :class="group.pages.length ? 'badge-ghost tabular-nums' : 'badge-outline'"
                      x-text="group.pages.length ? group.pages.length + ' ' + t(group.pages.length === 1 ? 'components.page' : 'components.pages') : t('components.soon')"
                    ></span>
                  </div>

                  <p class="text-base-content/70 mt-2 text-sm leading-relaxed" x-text="group.blurb"></p>

                  <ul class="mt-3 flex flex-col gap-1" x-show="group.pages.length">
                    <template x-for="page in group.pages" :key="page.path">
                      <li><a :href="site(page.path)" class="link link-hover text-accent inline-flex min-h-6 items-center text-sm" x-text="page.title"></a></li>
                    </template>
                  </ul>
                </li>
              </template>
            </ul>
          </div>
        </section>

        <!-- ═══════════════════════════ 3 · what it does, what you do ═══════════════════════════ -->
        <section class="bg-base-200 border-base-300 border-b">
          <div class="mx-auto max-w-[1240px] px-5 py-20 sm:px-8 sm:py-24">
            <h2 class="text-[1.75rem] leading-[var(--leading-heading)] font-bold tracking-tight sm:text-3xl" x-text="t('overview.title')"></h2>
            <p class="lede text-base-content/70 mt-4 text-lg" x-text="t('overview.lede')"></p>

            <div class="mt-12 grid gap-10 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.1fr)] lg:items-center lg:gap-16">
              <!-- The division of labour, drawn: a dense stack the element owns,
                   three plain inputs you own, one boundary between them. -->
              <svg viewBox="0 0 440 300" fill="none" class="h-auto w-full max-w-[520px]" aria-hidden="true">
                <rect x="16" y="24" width="196" height="252" rx="16" class="text-accent" stroke="currentColor" stroke-width="2.5" />
                <rect x="16" y="24" width="196" height="44" rx="16" class="text-primary" fill="currentColor" opacity=".18" />
                <rect x="36" y="40" width="104" height="12" rx="6" class="text-accent" fill="currentColor" />
                <g class="text-base-content/30" fill="currentColor">
                  <rect x="36" y="90" width="156" height="10" rx="5" />
                  <rect x="36" y="118" width="132" height="10" rx="5" />
                  <rect x="36" y="146" width="150" height="10" rx="5" />
                  <rect x="36" y="174" width="120" height="10" rx="5" />
                  <rect x="36" y="202" width="144" height="10" rx="5" />
                </g>
                <circle cx="184" cy="232" r="14" class="text-primary" fill="currentColor" />
                <path d="M178 232l4 4 8-9" class="text-primary-content" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

                <g class="text-base-300" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8">
                  <path d="M244 150V44M244 150v106" />
                </g>

                <g class="rtl:-scale-x-100" style="transform-origin: 240px 150px">
                  <path d="M212 74h44M212 150h44M212 226h44" class="text-base-300" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 8" />
                </g>

                <g class="text-base-300" stroke="currentColor" stroke-width="2.5">
                  <rect x="264" y="56" width="160" height="36" rx="10" />
                  <rect x="264" y="132" width="160" height="36" rx="10" />
                  <rect x="264" y="208" width="160" height="36" rx="10" />
                </g>
                <g class="text-base-content/45" fill="currentColor">
                  <rect x="284" y="69" width="88" height="10" rx="5" />
                  <rect x="284" y="145" width="66" height="10" rx="5" />
                  <rect x="284" y="221" width="102" height="10" rx="5" />
                </g>
              </svg>

              <div class="grid gap-8 sm:grid-cols-2 lg:gap-10">
                <div>
                  <p class="eyebrow text-accent font-bold" x-text="t('overview.elementTitle')"></p>
                  <ul class="mt-4 flex flex-col gap-3">
                    <template x-for="item in list('overview.elementItems')" :key="item">
                      <li class="text-base-content/80 flex gap-2.5 text-[15px] leading-relaxed">
                        <svg
                          class="text-accent mt-1 h-4 w-4 shrink-0"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2.4"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          aria-hidden="true"
                        >
                          <path d="m5 12.5 4.5 4.5L19 7.5" />
                        </svg>
                        <span x-text="item"></span>
                      </li>
                    </template>
                  </ul>
                </div>

                <div>
                  <p class="eyebrow text-base-content/65 font-bold" x-text="t('overview.youTitle')"></p>
                  <ul class="mt-4 flex flex-col gap-3">
                    <template x-for="item in list('overview.youItems')" :key="item">
                      <li class="text-base-content/80 flex gap-2.5 text-[15px] leading-relaxed">
                        <span class="bg-base-300 mt-2 h-1.5 w-1.5 shrink-0 rounded-full" aria-hidden="true"></span>
                        <span x-text="item"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </div>
            </div>

            <p class="text-base-content/70 mt-12 max-w-[70ch] text-[15px] leading-relaxed" x-text="t('overview.body3')"></p>
          </div>
        </section>

        <!-- ═══════════════════════════ 4 · where it sits ═══════════════════════════ -->
        <section class="bg-base-100 border-base-300 border-b">
          <div class="mx-auto max-w-[1240px] px-5 py-20 sm:px-8">
            <h2 class="text-2xl leading-[var(--leading-heading)] font-bold tracking-tight" x-text="t('stack.title')"></h2>
            <p class="lede text-base-content/70 mt-3" x-text="t('stack.lede')"></p>

            <div class="mt-12 grid gap-12 lg:grid-cols-[minmax(0,1.3fr)_minmax(0,1fr)] lg:items-center">
              <ol class="border-accent/50 ms-4 flex flex-col border-s-2">
                <template x-for="(item, index) in list('stack.items')" :key="item.name">
                  <li class="relative ps-8 pb-8 last:pb-0">
                    <!-- -ms-3.5 is half of w-7, as a LOGICAL offset. translateX(-50%)
                         is physical: it shifts left in both directions, so under RTL
                         it covered a letter of every step heading. -->
                    <span
                      class="bg-primary text-primary-content absolute start-0 top-0 -ms-3.5 flex h-7 w-7 items-center justify-center rounded-full text-xs font-bold tabular-nums"
                      x-text="index + 1"
                    ></span>
                    <p class="text-base font-semibold" x-text="item.name"></p>
                    <p class="text-base-content/70 mt-1 max-w-[62ch] text-[15px] leading-relaxed" x-text="item.body"></p>
                  </li>
                </template>
              </ol>

              <svg viewBox="0 0 280 250" fill="none" class="hidden h-auto w-full max-w-[340px] justify-self-center lg:block" aria-hidden="true">
                <g class="text-base-300" stroke="currentColor" stroke-width="2">
                  <rect x="20" y="12" width="240" height="46" rx="10" />
                  <rect x="32" y="76" width="216" height="46" rx="10" />
                  <rect x="68" y="204" width="144" height="38" rx="10" />
                </g>
                <rect x="44" y="140" width="192" height="46" rx="10" class="text-primary" fill="currentColor" opacity=".14" />
                <rect x="44" y="140" width="192" height="46" rx="10" class="text-accent" stroke="currentColor" stroke-width="2.5" />
                <g class="text-base-content/35" fill="currentColor">
                  <rect x="38" y="30" width="96" height="10" rx="5" />
                  <rect x="50" y="94" width="76" height="10" rx="5" />
                  <rect x="86" y="218" width="58" height="10" rx="5" />
                </g>
                <rect x="62" y="158" width="112" height="10" rx="5" class="text-accent" fill="currentColor" />
                <g class="text-base-300" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7">
                  <path d="M140 58v18M140 122v18M140 186v18" />
                </g>
              </svg>
            </div>
          </div>
        </section>

        <!-- ═══════════════════════════ 5 · quickstart ═══════════════════════════ -->
        <section id="quickstart" class="bg-base-200 border-base-300 scroll-mt-20 border-b">
          <div class="mx-auto max-w-[1240px] px-5 py-20 sm:px-8 sm:py-24">
            <h2 class="text-[1.75rem] leading-[var(--leading-heading)] font-bold tracking-tight sm:text-3xl" x-text="t('quickstart.title')"></h2>
            <p class="lede text-base-content/70 mt-4 text-lg" x-text="t('quickstart.lede')"></p>

            <ol class="mt-12 flex flex-col gap-8">
              <template x-for="(step, index) in list('quickstart.steps')" :key="step.name">
                <li class="grid gap-4 lg:grid-cols-[minmax(0,19rem)_minmax(0,1fr)] lg:gap-10">
                  <div>
                    <p class="eyebrow text-accent font-bold" x-text="'0' + (index + 1)"></p>
                    <p class="mt-1 font-semibold" x-text="step.name"></p>
                    <p class="text-base-content/70 mt-1 text-sm leading-relaxed" x-text="step.body"></p>
                  </div>

                  <figure class="rounded-field border-base-300 m-0 overflow-hidden border">
                    <figcaption class="bg-base-100 border-base-300 flex items-center justify-between gap-3 border-b py-1.5 ps-4 pe-2">
                      <span class="eyebrow text-base-content/65" x-text="quickstart[index].lang"></span>
                      <button
                        type="button"
                        class="btn btn-sm btn-ghost btn-square"
                        :aria-label="copied === 'step' + index ? t('install.copied') : t('install.copyLabel')"
                        @click="copy('step' + index, quickstart[index].code)"
                      >
                        <template x-if="copied !== 'step' + index">
                          <svg
                            class="h-4 w-4"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                          >
                            <rect x="9" y="9" width="11" height="11" rx="2.5" />
                            <path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5" />
                          </svg>
                        </template>
                        <template x-if="copied === 'step' + index">
                          <svg
                            class="text-success h-4 w-4"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                          >
                            <path d="m5 12.5 4.5 4.5L19 7.5" />
                          </svg>
                        </template>
                      </button>
                    </figcaption>
                    <pre class="code m-0 p-4"><code x-html="highlight(quickstart[index].code, quickstart[index].lang)"></code></pre>
                  </figure>
                </li>
              </template>
            </ol>

            <div class="mt-10 grid gap-4 lg:grid-cols-2">
              <p class="border-accent/50 text-base-content/70 border-s-2 ps-4 text-sm leading-relaxed" x-text="t('quickstart.note')"></p>
              <p class="border-accent/50 text-base-content/70 border-s-2 ps-4 text-sm leading-relaxed" x-text="t('quickstart.network')"></p>
            </div>
          </div>
        </section>

        <!-- ═══════════════════════════ 6 · install ═══════════════════════════ -->
        <section id="install" class="bg-base-100 border-base-300 scroll-mt-20 border-b">
          <div class="mx-auto max-w-[1240px] px-5 py-20 sm:px-8 sm:py-24">
            <h2 class="text-[1.75rem] leading-[var(--leading-heading)] font-bold tracking-tight sm:text-3xl" x-text="t('install.title')"></h2>
            <p class="lede text-base-content/70 mt-4 text-lg" x-text="t('install.lede')"></p>

            <div class="mt-8 flex flex-wrap items-center gap-x-6 gap-y-3">
              <div class="flex flex-wrap gap-1.5" role="group" :aria-label="t('install.title')">
                <template x-for="tab in installTabs" :key="tab">
                  <button
                    type="button"
                    class="btn btn-sm gap-2"
                    :class="installTab === tab ? 'btn-primary' : 'btn-outline'"
                    :aria-pressed="installTab === tab"
                    @click="installTab = tab"
                  >
                    <span x-text="t('install.' + tab)"></span>
                    <span class="badge badge-xs badge-ghost" x-show="tab === 'library'" x-text="t('install.recommended')"></span>
                  </button>
                </template>
              </div>

              <div class="flex items-center gap-2">
                <span class="eyebrow text-base-content/65" x-text="t('install.version')"></span>
                <div class="flex gap-1.5" role="group" :aria-label="t('install.version')">
                  <template x-for="mode in ['latest', 'pinned']" :key="mode">
                    <button type="button" class="btn btn-xs gap-1.5" :class="pin === mode ? 'btn-primary' : 'btn-outline'" :aria-pressed="pin === mode" @click="pin = mode">
                      <span x-text="mode === 'pinned' ? t('install.pinned') + (version ? ' v' + version : '') : t('install.latest')"></span>
                      <span class="badge badge-xs badge-ghost" x-show="mode === 'latest'" x-text="t('install.recommended')"></span>
                    </button>
                  </template>
                </div>
              </div>
            </div>

            <div class="mt-4 max-w-[72rem]">
              <figure class="rounded-field border-base-300 m-0 overflow-hidden border">
                <figcaption class="bg-base-200 border-base-300 flex items-center justify-between gap-3 border-b py-1.5 ps-4 pe-2">
                  <span class="eyebrow text-base-content/65" x-text="snippet.lang"></span>
                  <button
                    type="button"
                    class="btn btn-sm btn-ghost btn-square"
                    :aria-label="copied === 'install' ? t('install.copied') : t('install.copyLabel')"
                    @click="copy('install', snippet.code)"
                  >
                    <template x-if="copied !== 'install'">
                      <svg
                        class="h-4 w-4"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <rect x="9" y="9" width="11" height="11" rx="2.5" />
                        <path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5" />
                      </svg>
                    </template>
                    <template x-if="copied === 'install'">
                      <svg
                        class="text-success h-4 w-4"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                      >
                        <path d="m5 12.5 4.5 4.5L19 7.5" />
                      </svg>
                    </template>
                  </button>
                </figcaption>
                <pre class="code m-0 p-4"><code x-html="highlight(snippet.code, snippet.lang)"></code></pre>
              </figure>

              <p class="text-base-content/70 mt-3 text-sm" x-text="t('install.' + installTab + 'Note')"></p>
              <p class="text-base-content/70 mt-1 text-sm" x-text="t('install.' + pin + 'Note')"></p>
              <p class="text-base-content/65 mt-4 text-sm" x-text="t('install.bundler')"></p>
            </div>
          </div>
        </section>

        <!-- ═══════════════════════════ 7 · versions ═══════════════════════════ -->
        <section class="bg-base-200 border-base-300 border-b">
          <div class="mx-auto max-w-[1240px] px-5 py-20 sm:px-8">
            <h2 class="text-2xl leading-[var(--leading-heading)] font-bold tracking-tight" x-text="t('versions.title')"></h2>
            <p class="lede text-base-content/70 mt-3" x-text="t('versions.lede')"></p>

            <ol class="mt-10 grid gap-5 lg:grid-cols-3">
              <template x-for="(item, index) in list('versions.items')" :key="item.name">
                <li class="card bg-base-100 border-base-300 flex flex-col gap-2 border p-6">
                  <span class="bg-primary text-primary-content flex h-7 w-7 items-center justify-center rounded-full text-xs font-bold tabular-nums" x-text="index + 1"></span>
                  <p class="mt-1 font-semibold" x-text="item.name"></p>
                  <p class="text-base-content/70 text-sm leading-relaxed" x-text="item.body"></p>
                </li>
              </template>
            </ol>

            <p class="text-base-content/70 mt-6 text-sm" x-text="t('versions.note')"></p>
          </div>
        </section>

        <!-- ═══════════════════════════ 8 · what you get ═══════════════════════════ -->
        <section id="features" class="bg-base-100 border-base-300 scroll-mt-20 border-b">
          <div class="mx-auto max-w-[1240px] px-5 py-20 sm:px-8">
            <h2 class="text-2xl leading-[var(--leading-heading)] font-bold tracking-tight" x-text="t('features.title')"></h2>
            <p class="lede text-base-content/70 mt-3" x-text="t('features.lede')"></p>

            <ul class="mt-10 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
              <template x-for="(item, index) in list('features.items')" :key="item.name">
                <li class="card bg-base-200 border-base-300 flex flex-col gap-3 border p-6">
                  <span class="bg-primary/15 text-accent flex h-10 w-10 items-center justify-center rounded-xl" aria-hidden="true">
                    <svg
                      class="h-5 w-5"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.9"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      x-html="featureIcon(index)"
                    ></svg>
                  </span>
                  <p class="font-semibold" x-text="item.name"></p>
                  <p class="text-base-content/70 text-sm leading-relaxed" x-text="item.body"></p>
                </li>
              </template>
            </ul>
          </div>
        </section>

        <!-- ═══════════════════════════ 9 · next steps ═══════════════════════════ -->
        <section class="bg-base-200">
          <div class="mx-auto max-w-[1240px] px-5 py-20 sm:px-8">
            <h2 class="text-2xl leading-[var(--leading-heading)] font-bold tracking-tight" x-text="t('support.title')"></h2>

            <ul class="mt-8 grid gap-5 md:grid-cols-3">
              <template x-for="(item, index) in list('support.items')" :key="item.name">
                <li class="card bg-base-100 border-base-300 flex flex-col gap-2 border p-6">
                  <p class="font-semibold" x-text="item.name"></p>
                  <p class="text-base-content/70 text-sm leading-relaxed" x-text="item.body"></p>

                  <template x-if="supportLink(index)">
                    <a
                      class="link link-hover text-accent mt-1 inline-flex min-h-6 items-center gap-1.5 text-sm font-medium"
                      :href="supportLink(index)"
                      target="_blank"
                      rel="noreferrer"
                    >
                      <span x-text="supportLabel(index)"></span>
                      <span class="rtl:-scale-x-100" aria-hidden="true">→</span>
                    </a>
                  </template>
                </li>
              </template>
            </ul>

            <!-- The rest of the estate. Product names are frozen terms, so the
                 labels are presentation, not copy — only the heading translates. -->
            <p class="eyebrow text-base-content/65 mt-12" x-text="t('support.ecosystem')"></p>
            <ul class="border-base-300 mt-4 flex flex-wrap gap-x-6 gap-y-3 border-t pt-5">
              <template x-for="link in ECOSYSTEM" :key="link.href">
                <li>
                  <a class="link link-hover text-accent inline-flex min-h-6 items-center gap-1.5 text-sm font-medium" :href="link.href" target="_blank" rel="noreferrer">
                    <span x-text="link.name"></span>
                    <span class="rtl:-scale-x-100 opacity-60" aria-hidden="true">→</span>
                  </a>
                </li>
              </template>
            </ul>
          </div>
        </section>
      </main>

      <footer class="bg-base-200 wash wash-up border-base-300 border-t [--wash-reach:100%]" :inert="mobile">
        <div class="mx-auto flex max-w-[1240px] flex-wrap items-center gap-x-4 gap-y-3 px-5 py-10 sm:px-8">
          <span class="bg-primary flex items-center justify-center rounded-lg px-2 py-1.5">
            <span class="adp-logo text-primary-content h-3.5 w-[36px]" aria-hidden="true"></span>
          </span>
          <p class="text-base-content/70 text-sm" x-text="t('footer.tagline')"></p>
          <!--
            The package spec is wrapped in <bdi dir="ltr"> because it renders
            REVERSED otherwise: in an Arabic or Kurdish paragraph the @ sits
            between a Latin run and a numeric run, takes the paragraph direction,
            and splits the token into "1.2.3@adp-web-components".
          -->
          <p class="text-base-content/65 ms-auto font-mono text-xs" x-show="version">
            <span x-text="t('footer.built')"></span>
            <bdi dir="ltr" x-text="packageName + '@' + version"></bdi>
          </p>
        </div>
      </footer>

      <!-- Copy is a state change with no visual anchor for a screen reader, so it
           gets announced rather than only shown. -->
      <p class="sr-only" aria-live="polite" x-text="copied ? t('install.copied') : ''"></p>
    </div>

    <script>
      /*
       * Presentation only. Words live in site-locales.js; what pages exist lives
       * in catalog.json; the highlighter is templates/highlight.js; the top bar,
       * and with it the catalog, the language and the theme, is
       * templates/site-header.js. What is left here is icon geometry,
       * illustrations and the shape of a snippet — none of which are translatable
       * and none of which are data.
       */
      const FEATURE_ICONS = [
        '<path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18.5" cy="17" r="2.5"/>',
        '<path d="M12 3 4 6.5v5.2c0 4.5 3.2 8.6 8 9.8 4.8-1.2 8-5.3 8-9.8V6.5z"/><path d="m9.2 12.2 2 2 3.6-3.9"/>',
        '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/>',
        '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/>',
        '<path d="M8 5.5 3.5 12 8 18.5M16 5.5 20.5 12 16 18.5"/><path d="m13.5 4-3 16"/>',
      ];

      /*
       * One panel per component group. Each says what the group DOES rather than
       * naming it twice: a VIN read off a car, a part matched across three
       * sources, a form that becomes a ticket. Every colour is a theme token
       * through currentColor, so they invert with the theme.
       */
      const GROUP_ILLUSTRATIONS = {
        'vehicle-lookup': [
          '<path d="M16 66h228" class="text-base-300" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
          '<path d="M38 66V47a8 8 0 0 1 1.4-4.5l10.2-15A8 8 0 0 1 56.2 24h43.6a8 8 0 0 1 6.6 3.5l10.2 15A8 8 0 0 1 118 47v19z" class="text-accent" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>',
          '<path d="M50 46h56" class="text-accent" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
          '<circle cx="53" cy="57" r="3.5" class="text-accent" fill="currentColor"/><circle cx="103" cy="57" r="3.5" class="text-accent" fill="currentColor"/>',
          '<g class="text-base-content/35" fill="currentColor"><rect x="148" y="26" width="4" height="32" rx="2"/><rect x="156" y="26" width="2" height="32" rx="1"/><rect x="162" y="26" width="5" height="32" rx="2"/><rect x="171" y="26" width="2" height="32" rx="1"/><rect x="177" y="26" width="3" height="32" rx="1.5"/><rect x="184" y="26" width="5" height="32" rx="2"/><rect x="193" y="26" width="2" height="32" rx="1"/><rect x="199" y="26" width="4" height="32" rx="2"/><rect x="207" y="26" width="2" height="32" rx="1"/><rect x="213" y="26" width="5" height="32" rx="2"/><rect x="222" y="26" width="3" height="32" rx="1.5"/><rect x="229" y="26" width="2" height="32" rx="1"/></g>',
          '<rect x="148" y="74" width="83" height="9" rx="4.5" class="text-primary" fill="currentColor"/>',
        ].join(''),

        'part-lookup': [
          '<g transform="translate(20 10) scale(3.1)" class="text-accent" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g>',
          '<g class="text-base-300" stroke="currentColor" stroke-width="2"><rect x="130" y="22" width="112" height="18" rx="9"/><rect x="130" y="48" width="88" height="18" rx="9"/></g>',
          '<rect x="130" y="74" width="64" height="14" rx="7" class="text-primary" fill="currentColor"/>',
          '<path d="M112 31h14M112 57h14M112 81h14" class="text-base-300" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/>',
        ].join(''),

        'forms': [
          '<rect x="26" y="14" width="104" height="72" rx="10" class="text-accent" stroke="currentColor" stroke-width="2.5"/>',
          '<rect x="57" y="8" width="42" height="16" rx="6" class="text-base-100" fill="currentColor"/>',
          '<rect x="57" y="8" width="42" height="16" rx="6" class="text-accent" stroke="currentColor" stroke-width="2.5"/>',
          '<g class="text-base-content/35" fill="currentColor"><rect x="42" y="42" width="72" height="8" rx="4"/><rect x="42" y="60" width="50" height="8" rx="4"/></g>',
          '<g class="rtl:-scale-x-100" style="transform-origin: 176px 50px"><path d="M146 50h50" class="text-base-300" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 8"/><path d="M192 40l14 10-14 10z" class="text-accent" fill="currentColor"/></g>',
          '<rect x="216" y="30" width="34" height="40" rx="8" class="text-primary" fill="currentColor"/>',
          '<path d="M225 50l6 6 11-12" class="text-primary-content" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
        ].join(''),
      };

      /* Index-aligned with support.items; null means the card is prose only. */
      const SUPPORT_LINKS = ['https://adp.shift.software/', 'https://www.npmjs.com/package/adp-web-components?activeTab=versions', null];

      /* Product names are frozen terms — presentation, not translatable copy. */
      const ECOSYSTEM = [
        { name: 'ADP documentation', href: 'https://adp.shift.software/' },
        { name: 'Shift Framework docs', href: 'https://docs.shift.software/' },
        { name: 'adp-web-components on npm', href: 'https://www.npmjs.com/package/adp-web-components' },
        { name: 'ShiftSoftware on npm', href: 'https://www.npmjs.com/search?q=shiftsoftware' },
      ];

      const FALLBACK_VERSION = 'latest';

      /*
       * The page state, built on top of the header's.
       *
       * The header owns the catalog, the language and the theme because it is
       * what reads them first — and the body needs the same three, so it takes
       * them from the same object rather than keeping a second copy. Everything
       * below is what only this page has: the snippets, the illustrations and the
       * copy button.
       *
       * siteHeader() is on window because this is a classic script and cannot
       * import; the module in <head> is deferred, so it has run by the time
       * Alpine calls this.
       */
      function landing() {
        return window.siteHeader({
          installTab: 'library',
          installTabs: ['library', 'single'],
          /* @latest is the recommended default: a fix reaches a host page without
             a redeploy, and the rule that actually matters — one version per
             document — is unaffected by which of the two you pick. */
          pin: 'latest',
          copied: null,
          ECOSYSTEM,

          /* ---------- copy ---------- */

          /** Lists are arrays, not strings, so they bypass `t`'s string fallback. */
          list(key) {
            const value = window.siteLocales.t(this.language, key);

            return Array.isArray(value) ? value : [];
          },

          /* ---------- package identity ---------- */

          get packageName() {
            return this.catalog.package?.name ?? 'adp-web-components';
          },

          /* ---------- component groups ---------- */

          groupIllustration(id) {
            return GROUP_ILLUSTRATIONS[id] ?? '';
          },

          featureIcon(index) {
            return FEATURE_ICONS[index] ?? '';
          },

          supportLink(index) {
            return SUPPORT_LINKS[index] ?? null;
          },

          supportLabel(index) {
            return this.list('support.links')[index] ?? this.list('support.items')[index]?.name ?? '';
          },

          /* ---------- snippets ---------- */

          get cdn() {
            return 'https://cdn.jsdelivr.net/npm/' + this.packageName + '@' + (this.pin === 'latest' ? 'latest' : this.version || FALLBACK_VERSION);
          },

          get snippet() {
            // The closing tag is escaped: an unescaped one inside this string
            // would end the surrounding <script> block and break the page.
            if (this.installTab === 'library') {
              return {
                lang: 'HTML',
                code: '<script type="module"\n  src="' + this.cdn + '/dist/shift-components/shift-components.esm.js"><\/script>',
              };
            }

            return {
              lang: 'JavaScript',
              code: [
                "import { loadComponent } from '" + this.cdn + "/dist/host-loader.js';",
                '',
                'await loadComponent({',
                "  moduleUrl: '" + this.cdn + "/dist/components/vehicle-service-history.js',",
                "  tag: 'vehicle-service-history',",
                "  packageVersion: '" + (this.pin === 'latest' ? 'latest' : this.version || FALLBACK_VERSION) + "',",
                '});',
              ].join('\n'),
            };
          },

          /*
           * The quickstart is `production-host/vehicle-service-history.html`,
           * split into its three moves. Keep it in step with that file — it is the
           * copy-paste original; this is the narrated version.
           */
          get quickstart() {
            return [
              {
                lang: 'HTML',
                code: '<script type="module"\n  src="' + this.cdn + '/dist/shift-components/shift-components.esm.js"><\/script>',
              },
              {
                lang: 'HTML',
                code: [
                  '<vehicle-service-history',
                  '  id="service-history"',
                  '  language="en"',
                  '  base-url="https://<your-adp-host>/api/vehicle-lookup/"',
                  '></vehicle-service-history>',
                ].join('\n'),
              },
              {
                /*
                 * HTML, not JavaScript, and deliberately so: this uses top-level
                 * await, which is legal only inside a module. Presented as bare JS
                 * — which is how it read — pasting it where the page says to put it
                 * is an outright SyntaxError. The catch is here because the first
                 * run always throws: the VIN is a placeholder and the base URL is
                 * not yours yet.
                 */
                lang: 'HTML',
                code: [
                  '<script type="module">',
                  "  const element = document.getElementById('service-history');",
                  '',
                  '  try {',
                  "    await element.fetchVin('<a real 17-character VIN>');",
                  '  } catch (error) {',
                  '    console.error(error);',
                  '  }',
                  '<\/script>',
                ].join('\n'),
              },
            ];
          },

          /* templates/highlight.js, loaded as a module in the head — see the note
             on that tag for why it arrives through window rather than an import
             here. Same five tok-* classes, styled in harness.src.css. */
          highlight(code, lang) {
            return window.adpHighlight(code, lang);
          },

          async copy(id, text) {
            try {
              await navigator.clipboard.writeText(text);
              this.copied = id;
              setTimeout(() => (this.copied = null), 1600);
            } catch {
              // Clipboard is blocked outside a secure context; the text is selectable.
            }
          },
        });
      }
    </script>
  </body>
</html>
