<!doctype html>
<!--
  Showcase home.

  The page list is not written here — it is read from /templates/catalog.json,
  which `npm run build:templates` regenerates by scanning src/templates. A new
  demo page appears here by existing, and the version comes from package.json.
  Only the per-area icon and blurb are presentation, and those live in this file.

  Unlike a harness page, this one has no component under test, so the "keep the
  chrome quiet" rule does not apply: this is the surface itself.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ADP web components</title>

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Blocking on purpose: a deferred module would let the page paint light first. -->
    <script src="/templates/harness-theme.js"></script>

    <script defer src="/templates/vendor/alpine.js"></script>
  </head>

  <body class="bg-base-200 text-base-content min-h-screen">
    <div x-data="showcase()" x-cloak>
      <!-- both bars stack, so the wrapper owns the stickiness -->
      <div class="sticky top-0 z-20">
        <div class="bg-base-100/90 border-base-300 border-b backdrop-blur">
          <div class="mx-auto flex max-w-[1240px] flex-wrap items-center gap-x-4 gap-y-3 px-5 py-3 sm:px-8">
            <a href="#" @click.prevent="goHome()" class="group flex items-center gap-3" aria-label="Showcase home">
              <span class="adp-logo text-accent h-7 w-[68px] transition-opacity group-hover:opacity-70" aria-hidden="true"></span>
              <span class="bg-base-300 h-6 w-px" aria-hidden="true"></span>
              <span class="text-base font-semibold tracking-tight">
                <span class="text-accent">SHFT</span>
                <span class="text-base-content/70 group-hover:text-base-content font-normal transition-colors">your day</span>
              </span>
            </a>

            <span class="badge badge-sm badge-ghost font-mono" x-show="catalog.package" x-text="'v' + catalog.package?.version"></span>

            <div class="ms-auto flex flex-wrap items-center gap-x-4 gap-y-2">
              <div class="flex gap-1.5" role="group" aria-label="View">
                <template x-for="option in views" :key="option.value">
                  <button
                    type="button"
                    class="btn btn-sm"
                    :class="view === option.value ? 'btn-primary' : 'btn-ghost'"
                    :aria-pressed="view === option.value"
                    @click="setView(option.value)"
                    x-text="option.label"
                  ></button>
                </template>
              </div>

              <span class="bg-base-300 hidden h-6 w-px sm:block" aria-hidden="true"></span>

              <div class="flex gap-1.5" role="group" aria-label="Theme">
                <template x-for="option in ['system', 'light', 'dark']" :key="option">
                  <button
                    type="button"
                    class="btn btn-sm capitalize"
                    :class="theme === option ? 'btn-primary' : 'btn-ghost'"
                    :aria-pressed="theme === option"
                    @click="setTheme(option)"
                    x-text="option"
                  ></button>
                </template>
              </div>
            </div>
          </div>
        </div>

        <div class="bg-base-200/85 border-base-300 border-b backdrop-blur" x-show="view === 'flat'">
          <div class="mx-auto flex max-w-[1240px] flex-wrap items-center gap-3 px-5 py-3 sm:px-8">
            <button type="button" class="btn btn-sm btn-ghost gap-1.5" @click="goHome()">
              <span aria-hidden="true">←</span>
              All areas
            </button>

            <label class="input input-md min-w-[240px] flex-1">
              <svg class="h-5 w-5 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" stroke-linecap="round" />
              </svg>
              <input x-ref="search" x-model="query" type="search" placeholder="Search pages and components…" aria-label="Search demo pages" />
              <kbd class="kbd kbd-sm" x-show="!query">/</kbd>
            </label>

            <div class="flex flex-wrap gap-1.5" role="group" aria-label="Area">
              <button type="button" class="btn btn-sm" :class="area === 'all' ? 'btn-primary' : 'btn-ghost'" :aria-pressed="area === 'all'" @click="area = 'all'">All</button>
              <template x-for="entry in catalog.areas" :key="entry.id">
                <button
                  type="button"
                  class="btn btn-sm"
                  :class="area === entry.id ? 'btn-primary' : 'btn-ghost'"
                  :aria-pressed="area === entry.id"
                  @click="area = entry.id"
                  x-text="entry.label"
                ></button>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- hero -->
      <header class="border-base-300 relative overflow-hidden border-b" x-show="view === 'folders'">
        <div class="from-primary/10 pointer-events-none absolute inset-0 bg-gradient-to-br via-transparent to-transparent"></div>

        <div class="relative mx-auto max-w-[1240px] px-5 pt-12 pb-10 sm:px-8">
          <p class="eyebrow text-accent font-bold">adp-web-components</p>
          <h1 class="mt-3 text-4xl font-bold tracking-tight sm:text-5xl">Every demo, in one place</h1>
          <p class="lede text-base-content/70 mt-3 text-lg">Pick an area to browse it, or press <kbd class="kbd kbd-sm">/</kbd> to search everything at once.</p>
        </div>
      </header>

      <main class="mx-auto max-w-[1240px] px-5 py-9 sm:px-8">
        <template x-if="!catalog.pages.length">
          <p class="text-base-content/60 py-20 text-center">No catalog found. Run <code>npm start</code> to generate <code>/templates/catalog.json</code>.</p>
        </template>

        <!-- folders -->
        <div x-show="view === 'folders'">
          <div class="grid gap-5 md:grid-cols-2">
            <template x-for="entry in catalog.areas" :key="entry.id">
              <button
                type="button"
                class="card bg-base-100 border-base-300 hover:border-accent group flex flex-col items-start gap-3 border p-6 text-start transition-all hover:shadow-lg"
                @click="openArea(entry.id)"
              >
                <div class="flex w-full items-center gap-4">
                  <span
                    class="bg-primary/10 text-accent group-hover:bg-primary group-hover:text-primary-content flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl transition-colors"
                  >
                    <svg
                      class="h-7 w-7"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      x-html="icon(entry.id)"
                      aria-hidden="true"
                    ></svg>
                  </span>

                  <div class="min-w-0 flex-1">
                    <h2 class="group-hover:text-accent text-xl font-bold tracking-tight transition-colors" x-text="entry.label"></h2>
                    <p class="text-base-content/50 text-sm tabular-nums" x-text="entry.count + (entry.count === 1 ? ' page' : ' pages')"></p>
                  </div>

                  <span class="text-base-content/25 group-hover:text-accent text-xl transition-colors" aria-hidden="true">→</span>
                </div>

                <p class="text-base-content/70" x-text="blurb(entry.id)"></p>
              </button>
            </template>
          </div>

          <!-- install -->
          <section class="border-base-300 mt-12 border-t pt-10">
            <h2 class="text-xl font-bold tracking-tight">Install</h2>
            <p class="text-base-content/70 mt-2">Plain custom elements — the host page needs no framework.</p>

            <div class="mt-5 grid gap-4 md:grid-cols-2">
              <template x-for="snippet in install" :key="snippet.label">
                <div class="card bg-base-100 border-base-300 border p-4">
                  <div class="mb-2 flex items-center justify-between gap-3">
                    <span class="eyebrow text-neutral" x-text="snippet.label"></span>
                    <button type="button" class="btn btn-xs btn-ghost" @click="copy(snippet)" x-text="copied === snippet.label ? 'Copied' : 'Copy'"></button>
                  </div>
                  <pre class="log bg-base-200 border-base-300 m-0 rounded-md border p-3"><code x-text="snippet.code"></code></pre>
                </div>
              </template>
            </div>

            <p class="text-base-content/50 mt-4 text-sm"><code>@latest</code> always resolves to the newest release — pin a version only to freeze behaviour.</p>
          </section>
        </div>

        <!-- all pages -->
        <div x-show="view === 'flat'">
          <template x-if="catalog.pages.length && !results.length">
            <div class="py-20 text-center">
              <p class="text-lg font-semibold">Nothing matches “<span x-text="query"></span>”</p>
              <button type="button" class="btn btn-sm btn-outline mt-4" @click="reset()">Clear filters</button>
            </div>
          </template>

          <div class="flex flex-col gap-10">
            <template x-for="group in grouped" :key="group.id">
              <section>
                <div class="mb-4 flex items-center gap-3">
                  <svg
                    class="text-accent h-5 w-5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    x-html="icon(group.id)"
                    aria-hidden="true"
                  ></svg>
                  <h2 class="text-base font-bold tracking-tight" x-text="group.label"></h2>
                  <span class="bg-base-300 h-px flex-1" aria-hidden="true"></span>
                  <span class="eyebrow text-neutral tabular-nums" x-text="group.pages.length"></span>
                </div>

                <ul class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
                  <template x-for="page in group.pages" :key="page.path">
                    <li>
                      <a :href="page.path" class="card bg-base-100 border-base-300 hover:border-accent group flex h-full flex-col gap-2 border p-5 transition-all hover:shadow-lg">
                        <div class="flex items-start justify-between gap-2">
                          <span class="group-hover:text-accent text-base leading-snug font-semibold transition-colors" x-text="page.title"></span>
                          <span class="text-base-content/25 group-hover:text-accent shrink-0 transition-colors" aria-hidden="true">→</span>
                        </div>

                        <p class="text-base-content/55 font-mono text-sm break-all" x-text="page.tags.length ? page.tags.join(' · ') : page.path.replace('/templates/', '')"></p>

                        <span class="badge badge-sm badge-ghost mt-auto self-start" x-show="page.kind !== 'demo'" x-text="page.kind"></span>
                      </a>
                    </li>
                  </template>
                </ul>
              </section>
            </template>
          </div>
        </div>
      </main>
    </div>

    <script>
      // Presentation only — the catalog knows what exists, this knows how to draw it.
      const AREA_ICONS = {
        'vehicle-lookup':
          '<path d="M5 17h14M6.5 17V19a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-2M20.5 17V19a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-2"/><path d="M3 17v-4.2a2 2 0 0 1 .3-1L5.6 8A2 2 0 0 1 7.3 7h9.4a2 2 0 0 1 1.7 1l2.3 3.8a2 2 0 0 1 .3 1V17z"/><path d="M6.5 13.5h.01M17.5 13.5h.01"/>',
        'part-lookup':
          '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
        'forms': '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 11h8M8 15h5"/>',
        'production-host': '<rect x="2" y="4" width="20" height="7" rx="2"/><rect x="2" y="13" width="20" height="7" rx="2"/><path d="M6 7.5h.01M6 16.5h.01"/>',
        'root': '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/>',
        'prototypes': '<path d="m14.5 2.5 7 7L9 22H2v-7z"/><path d="M12 5 19 12"/><path d="M2 15h7v7"/>',
      };

      const AREA_BLURBS = {
        'vehicle-lookup': 'VIN-driven lookups — specification, warranty, service history, paint thickness and claimable items.',
        'part-lookup': 'Part number lookups across distributor, dead stock and manufacturer sources.',
        'forms': 'Structure-driven forms — vehicle quotation, service booking, test drive and general inquiry.',
        'production-host': 'Integration templates showing how a host application loads a component from the CDN.',
        'root': 'Standalone utilities that do not belong to one lookup area.',
        'prototypes': 'Frozen hand-built mock-ups. They record what a design looked like when a decision was taken — read, do not restyle.',
      };

      const FALLBACK_ICON = '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/>';

      function showcase() {
        return {
          catalog: { areas: [], pages: [] },
          query: '',
          area: 'all',
          view: 'folders',
          copied: null,
          theme: window.harnessTheme.current(),
          views: [
            { value: 'folders', label: 'Folders' },
            { value: 'flat', label: 'All pages' },
          ],

          async init() {
            try {
              const response = await fetch('/templates/catalog.json');
              if (response.ok) this.catalog = await response.json();
            } catch {
              // Leaves the "no catalog" empty state showing, which says how to fix it.
            }

            window.addEventListener('keydown', event => {
              const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(event.target.tagName);

              // `/` jumps to search from anywhere — including the folder view, which
              // has no search field of its own, so it switches views first.
              if (event.key === '/' && !typing) {
                event.preventDefault();
                this.setView('flat');
                this.$nextTick(() => this.$refs.search?.focus());
              }

              if (event.key === 'Escape' && typing) {
                this.query = '';
                event.target.blur();
              }
            });
          },

          /* `@latest` on purpose — a pinned version inside a copy-paste snippet is
             stale the day after it is written. */
          get install() {
            const name = this.catalog.package?.name ?? 'adp-web-components';

            return [
              { label: 'npm', code: 'npm i ' + name },
              // The closing tag is escaped: an unescaped one inside this string
              // would end the surrounding <script> block and break the page.
              { label: 'CDN', code: '<script type="module"\n  src="https://cdn.jsdelivr.net/npm/' + name + '@latest/dist/shift-components/shift-components.esm.js"><\/script>' },
            ];
          },

          async copy(snippet) {
            try {
              await navigator.clipboard.writeText(snippet.code);
              this.copied = snippet.label;
              setTimeout(() => (this.copied = null), 1500);
            } catch {
              // Clipboard is blocked outside a secure context; the text is selectable.
            }
          },

          setView(view) {
            this.view = view;
          },

          openArea(id) {
            this.area = id;
            this.query = '';
            this.view = 'flat';
            window.scrollTo({ top: 0 });
          },

          goHome() {
            this.reset();
            this.view = 'folders';
            window.scrollTo({ top: 0 });
          },

          setTheme(theme) {
            this.theme = theme;
            window.harnessTheme.apply(theme);
          },

          icon(id) {
            return AREA_ICONS[id] ?? FALLBACK_ICON;
          },

          blurb(id) {
            return AREA_BLURBS[id] ?? '';
          },

          get results() {
            const needle = this.query.trim().toLowerCase();

            return this.catalog.pages.filter(page => {
              if (this.area !== 'all' && page.area !== this.area) return false;
              if (!needle) return true;

              return [page.title, page.path, ...page.tags].join(' ').toLowerCase().includes(needle);
            });
          },

          get grouped() {
            return this.catalog.areas.map(entry => ({ ...entry, pages: this.results.filter(page => page.area === entry.id) })).filter(group => group.pages.length);
          },

          reset() {
            this.query = '';
            this.area = 'all';
          },
        };
      }
    </script>
  </body>
</html>
