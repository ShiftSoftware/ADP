<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sale information — adp-web-components</title>

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Blocking on purpose: a deferred module would let the page paint light first. -->
    <script src="/templates/harness-theme.js"></script>

    <script nomodule src="/build/shift-components.js"></script>
    <script type="module" src="/build/shift-components.esm.js"></script>

    <script src="./mock-data.js"></script>
    <script src="./mock-loader.js"></script>
    <script type="module" src="/templates/harness.js"></script>
    <script defer src="/templates/vendor/alpine.js"></script>
  </head>

  <body class="bg-base-200 text-base-content min-h-screen">
    <!-- Every area and page, read from catalog.json. -->
    <div data-harness-nav x-cloak></div>

    <div class="mx-auto flex max-w-[1180px] flex-col gap-8 px-4 py-10 sm:px-8">
      <header>
        <p class="eyebrow text-neutral">adp-web-components · vehicle lookup</p>
        <h1 class="mt-1 text-2xl font-bold tracking-tight">Sale information</h1>
        <p class="lede text-base-content/70 mt-2">
          Who sold the vehicle, when, and through which intermediaries. Like the specification page, this one is wired the Blazor way — <code>setBlazorRef</code> plus callbacks
          named as attribute strings.
        </p>
      </header>

      <section
        class="flex flex-col gap-4"
        x-data="harness({
          mocks: 'vehicle-lookup',
          has: vehicle => Boolean(vehicle?.saleInformation),
          events: false,
        })"
      >
        <!-- Mode + fixtures, right where they are used. -->
        <div data-harness-bar x-cloak></div>

        <div class="frame card bg-base-100 border-base-300 border p-5">
          <vehicle-sale-information
            id="subject"
            language="en"
            base-url=""
            query-string=""
            error-callback="blazorErrorCallback"
            loaded-response="blazorLoadedResponse"
            loading-state-change="blazorLoadingStateChange"
          ></vehicle-sale-information>
        </div>

        <!-- The harness drawer: launcher, right-edge hover strip and panel, all stamped by harness.js. -->
        <div data-harness-rail x-cloak></div>
      </section>
    </div>

    <script>
      /*
       * A stand-in for the DotNetObjectReference a Blazor host would pass in: the
       * component looks its callbacks up by name and invokes them through this
       * object, so the three `*-callback` attributes above are the whole contract.
       *
       * `harness({ events: false })` keeps the harness from assigning functions
       * over those props; the log is fed from here instead.
       */
      const report = (label, detail) => window.dispatchEvent(new CustomEvent('harness:log', { detail: { label, detail } }));

      const blazorCallbacks = {
        blazorErrorCallback: error => report('error', error),
        blazorLoadedResponse: response => report('loaded', response?.vin ?? '(no vin)'),
        blazorLoadingStateChange: isLoading => report(isLoading ? 'loading' : 'idle', ''),
      };

      // `setBlazorRef` is a @Method, so it does not exist until the element has
      // upgraded — and this classic script runs before the deferred component module.
      customElements.whenDefined('vehicle-sale-information').then(async () => {
        const subject = document.querySelector('#subject');

        await subject.componentOnReady?.();

        subject.setBlazorRef({ invokeMethodAsync: (name, ...args) => blazorCallbacks[name]?.(...args) });
      });
    </script>
  </body>
</html>
