<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vehicle accessories — adp-web-components</title>
    <link rel="icon" href="/templates/assets/favicon.svg" type="image/svg+xml" />

    <meta name="adp-publish" content="true" />

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Both blocking on purpose: theme and text direction are decided before the first paint, or the page visibly jumps. -->
    <script src="/templates/harness-theme.js"></script>
    <script src="/templates/site-locales.js"></script>

    <script nomodule src="/build/shift-components.js"></script>
    <script type="module" src="/build/shift-components.esm.js"></script>

    <script type="module" src="/templates/harness.js"></script>
    <script defer src="/templates/vendor/alpine.js"></script>
  </head>

  <body class="wide-column bg-base-200 text-base-content min-h-screen">
    <!-- The site header, the same one the home page has; harness.js mounts it at the shell's width. -->
    <div data-site-header></div>

    <!-- One shell for every demo: the component gets the column in full, and the column is a wide one. See harness.js. -->
    <section
      class="showcase"
      dir="ltr"
      x-data="harness({
        mocks: 'vehicle-lookup',
        labels: {
          ZT8LY7CZ0S2959088: 'no accessories on record',
          JTMW43FV10D123456: 'no accessories on record',
          ZV9LMW6D75T151181: 'not in distributor records',
          UNKNOWN_VIN_12345: 'not in distributor records',
        },
        has: vehicle => vehicle?.accessories?.length > 0,
      })"
    >
      <!-- The brief: a one-line title above the component, the about text below it. -->
      <div class="showcase-brief">
        <header class="showcase-title flex flex-wrap items-baseline gap-x-3 gap-y-1">
          <h1 class="text-lg font-bold tracking-tight">Vehicle accessories</h1>
          <p class="eyebrow text-neutral">adp-web-components · vehicle lookup</p>
        </header>

        <!-- What the page demonstrates, beside the demo rather than above it: the component is what the page is for. -->
        <aside class="showcase-about border-base-300 border-t border-dashed pt-5">
          <p class="eyebrow text-neutral">About this page</p>
          <p class="lede text-base-content/70 mt-2 text-sm">Accessories recorded against the VIN. Not every fixture has any — an empty result is a state worth looking at too.</p>
        </aside>
      </div>

      <!-- Only the stage follows the language control; the shell around it stays put. -->
      <div class="showcase-stage flex flex-col gap-3" :dir="dir">
        <!-- Generated fixtures. This page has no field of its own — the chips are the search — so they get a dashed card above the component. -->
        <div data-harness-fixtures class="card border-base-300 bg-base-100 border border-dashed p-3" x-cloak></div>

        <!-- No card of the page's own around the component: the component draws the design language's card itself. -->
        <div class="frame">
          <vehicle-accessories id="subject" language="en" query-string=""></vehicle-accessories>
        </div>
      </div>

      <!-- The harness drawer: launcher, right-edge hover strip and panel, all stamped by harness.js. -->
      <div data-harness-rail x-cloak></div>
    </section>
  </body>
</html>
