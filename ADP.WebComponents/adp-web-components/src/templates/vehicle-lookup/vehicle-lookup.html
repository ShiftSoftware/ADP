<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vehicle lookup — adp-web-components</title>

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Blocking on purpose: a deferred module would let the page paint light first. -->
    <script src="/templates/harness-theme.js"></script>

    <script nomodule src="/build/shift-components.js"></script>
    <script type="module" src="/build/shift-components.esm.js"></script>

    <script src="./mock-data.js"></script>
    <script src="./mock-loader.js"></script>
    <script type="module" src="/templates/harness.js"></script>
    <script defer src="/templates/vendor/alpine.js"></script>
  </head>

  <body class="bg-base-200 text-base-content min-h-screen">
    <!-- Every area and page, read from catalog.json. -->
    <div data-harness-nav x-cloak></div>

    <div class="mx-auto flex max-w-[1400px] flex-col gap-8 px-4 py-10 sm:px-8">
      <header>
        <p class="eyebrow text-neutral">adp-web-components · vehicle lookup</p>
        <h1 class="mt-1 text-2xl font-bold tracking-tight">Vehicle lookup</h1>
        <p class="lede text-base-content/70 mt-2">
          The shell that holds all eight vehicle components and shows one at a time. The VIN field and the tab strip below belong to the host — a page embedding this component has
          to build them, and they are what drive <code>fetchVin()</code> and <code>active-element</code>.
        </p>
      </header>

      <section
        class="flex flex-col gap-4"
        x-data="harness({
          profile: 'composite',
          mocks: 'vehicle-lookup',
          labels: {
            JTMABBBJ9P4099200: 'realistic',
            JTMABBBJ9P4099201: 'realistic, at distributor stock',
            '1G8ZY1275YZ188208': 'inactive services',
            BLOCKEDNOTALLOC01: 'blocked, not allocated',
          },
        })"
      >
        <div class="flex min-w-0 flex-col gap-4">
          <!--
            Host-side chrome, not harness chrome: a real embedding page owns the
            VIN field and the tab strip, so they stay in the page body rather than
            moving into the rail.
          -->
          <div class="card bg-base-100 border-base-300 flex flex-col gap-2 border p-4" x-data="{ vin: 'MR0AX8CDXP4446478' }">
            <div class="flex flex-wrap items-center gap-3">
              <label class="input min-w-60 flex-1">
                <span class="eyebrow text-neutral">VIN</span>
                <input x-model="vin" type="search" autocomplete="off" aria-label="VIN" :readonly="loading" @keydown.enter.prevent="run(vin)" />
              </label>

              <button type="button" class="btn btn-primary" :disabled="loading" @click="run(vin)">
                <span class="loading loading-spinner loading-xs" x-show="loading"></span>
                Search
              </button>
            </div>

            <p class="text-error text-sm" x-show="error" x-text="error"></p>
          </div>

          <!--
            The old page disabled every inactive tab while a search was in flight —
            that is the one piece of the jQuery wiring worth keeping, so it is here
            as a binding instead.
          -->
          <div role="tablist" class="tabs tabs-box self-start" x-data="{ tab: 'vehicle-specification' }">
            <template
              x-for="item in [
                { value: 'vehicle-specification', label: 'Specification' },
                { value: 'vehicle-sale-information', label: 'Sale information' },
                { value: 'vehicle-accessories', label: 'Accessories' },
                { value: 'vehicle-warranty-details', label: 'Warranty & SSC' },
                { value: 'vehicle-warranty-timeline', label: 'Warranty timeline' },
                { value: 'vehicle-service-history', label: 'Service history' },
                { value: 'vehicle-paint-thickness', label: 'Paint thickness' },
                { value: 'vehicle-claimable-items', label: 'Claimable items' },
              ]"
              :key="item.value"
            >
              <button
                type="button"
                role="tab"
                class="tab"
                :class="tab === item.value && 'tab-active'"
                :aria-selected="tab === item.value"
                :disabled="loading && tab !== item.value"
                @click="tab = item.value; subject.activeElement = item.value"
                x-text="item.label"
              ></button>
            </template>
          </div>

          <!-- Mode + fixtures, right where they are used. -->
          <div data-harness-bar x-cloak></div>

          <div class="frame card bg-base-100 border-base-300 border p-5">
            <vehicle-lookup
              id="subject"
              language="en"
              query-string=""
              active-element="vehicle-specification"
              base-url="http://localhost:7204/api/secure-vehicle-lookup/"
              children-props='{"vehicle-claimable-items":{"showTrace":true},"vehicle-warranty-details":{"showSsc":true,"recaptchaKey":"6LetFoYqAAAAAE0fg-070Qtm3z-DG24sMJ8wzY1f"},"vehicle-paint-thickness":{"showCertificateButton":true},"dynamic-claim":{"claimEndPoint":"http://localhost:5015/api/vehicle/service-claim","claim-via-barcode-scanner":"false"}}'
            ></vehicle-lookup>
          </div>
        </div>

        <!-- The harness drawer: launcher, right-edge hover strip and panel, all stamped by harness.js. -->
        <div data-harness-rail x-cloak></div>
      </section>
    </div>
  </body>
</html>
