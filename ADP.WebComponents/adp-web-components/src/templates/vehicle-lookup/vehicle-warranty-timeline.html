<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warranty Timeline</title>
    <script src="./warranty-mock-data.js"></script>
    <script src="./mock-loader.js"></script>
    <script nomodule src="/build/shift-components.js"></script>
    <script type="module" src="/build/shift-components.esm.js"></script>
  </head>
  <body>
    <a href="#" onclick="history.back()" style="color: blue; display: block; margin-bottom: 16px">Back</a>

    <h1>Vehicle Warranty Timeline</h1>
    <vehicle-warranty-timeline id="timeline" language="en" is-dev="true" query-string="" base-url="http://localhost:7204/api/secure-vehicle-lookup/"> </vehicle-warranty-timeline>

    <div class="button-container">
      <button class="sample-button" onclick="updateLang('en')">En</button>
      <button class="sample-button" onclick="updateLang('ku')">Ku</button>
      <button class="sample-button" onclick="updateLang('ar')">Ar</button>
      <button class="sample-button" onclick="updateLang('ru')">Ru</button>
    </div>

    <div class="button-container">
      <button class="sample-button" onclick="fetchVin('')">Empty</button>
      <button class="sample-button" onclick="fetchVin('error')">Error</button>
      <button class="sample-button" onclick="fetchVin('JTMHX01J8L4198295')">JTMHX01J8L4198295</button>
      <button class="sample-button" onclick="fetchVin('JTMABBBJ9P4099243')">JTMABBBJ9P4099243</button>
      <button class="sample-button" onclick="fetchVin('JTMHU09J6E4100543')">JTMHU09J6E4100543</button>
      <button class="sample-button" onclick="fetchVin('JTMABBBJ9P4099200')">JTMABBBJ9P4099200 (Multiple warranties)</button>
      <button class="sample-button" onclick="fetchVin('JTMABBBJ9P4099294')">JTMABBBJ9P4099294 (Broker Stock)</button>
    </div>

    <script>
      let timeline;

      document.addEventListener('DOMContentLoaded', function () {
        timeline = document.getElementById('timeline');

        loadMockData('vehicle-lookup').then(data => timeline.setMockData(data));

        timeline.loadingStateChange = isLoading => {
          console.log('isLoading: ' + isLoading);
        };

        timeline.loadedResponse = newResponse => console.log(newResponse);
      });

      function fetchVin(newVin) {
        timeline.fetchVin(newVin);
      }

      function updateLang(newLang) {
        timeline.language = newLang;
      }
    </script>

    <style>
      .button-container {
        margin-top: 50px;
        border: 1px solid #e1e1e1;
        padding: 20px;
        display: flex;
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        gap: 10px;
      }
      .sample-button {
        background-color: #428bca;
        padding: 10px 15px;
      }

      .sample-button:hover {
        background-color: #3071a9;
      }
    </style>
  </body>
</html>
