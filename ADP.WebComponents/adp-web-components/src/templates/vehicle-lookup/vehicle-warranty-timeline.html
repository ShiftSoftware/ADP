<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Warranty timeline — adp-web-components</title>

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Blocking on purpose: a deferred module would let the page paint light first. -->
    <script src="/templates/harness-theme.js"></script>

    <script nomodule src="/build/shift-components.js"></script>
    <script type="module" src="/build/shift-components.esm.js"></script>

    <script src="./warranty-mock-data.js"></script>
    <script src="./mock-loader.js"></script>
    <script type="module" src="/templates/harness.js"></script>
    <script defer src="/templates/vendor/alpine.js"></script>
  </head>

  <body class="bg-base-200 text-base-content min-h-screen">
    <!-- Every area and page, read from catalog.json. -->
    <div data-harness-nav x-cloak></div>

    <div class="mx-auto flex max-w-[1180px] flex-col gap-8 px-4 py-10 sm:px-8">
      <header>
        <p class="eyebrow text-neutral">adp-web-components · vehicle lookup</p>
        <h1 class="mt-1 text-2xl font-bold tracking-tight">Warranty timeline</h1>
        <p class="lede text-base-content/70 mt-2">
          Every warranty the vehicle carries, drawn against one shared date axis. The interesting fixtures are the ones with more than one contract, or with none yet in force.
        </p>
      </header>

      <section
        class="flex flex-col gap-4"
        x-data="harness({
          mocks: 'vehicle-lookup',
          // A VIN with no warranty draws an empty rail, so it is not worth offering here.
          has: vehicle => Boolean(vehicle?.warranty),
          labels: {
            JTMABBBJ9P4099200: 'multiple warranties',
            JTMABBBJ9P4099270: 'awaiting activation',
            JTMABBBJ9P4099271: 'awaiting activation, unauthorized',
            JTMABBBJ9P4099280: 'distributor possession',
            JTMABBBJ9P4099294: 'broker, un-invoiced',
          },
        })"
      >
        <!-- Mode + fixtures, right where they are used. -->
        <div data-harness-bar x-cloak></div>

        <div class="frame card bg-base-100 border-base-300 border p-5">
          <vehicle-warranty-timeline id="subject" language="en" query-string="" base-url="http://localhost:7204/api/secure-vehicle-lookup/"></vehicle-warranty-timeline>
        </div>

        <!-- The harness drawer: launcher, right-edge hover strip and panel, all stamped by harness.js. -->
        <div data-harness-rail x-cloak></div>
      </section>
    </div>
  </body>
</html>
