<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Warranty timeline — adp-web-components</title>
    <link rel="icon" href="/templates/assets/favicon.svg" type="image/svg+xml" />

    <meta name="adp-publish" content="true" />

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Both blocking on purpose: theme and text direction are decided before the first paint, or the page visibly jumps. -->
    <script src="/templates/harness-theme.js"></script>
    <script src="/templates/site-locales.js"></script>

    <script nomodule src="/build/shift-components.js"></script>
    <script type="module" src="/build/shift-components.esm.js"></script>

    <script type="module" src="/templates/harness.js"></script>
    <script defer src="/templates/vendor/alpine.js"></script>
  </head>

  <body class="bg-base-200 text-base-content min-h-screen">
    <!-- The site header, the same one the home page has; harness.js mounts it at the shell's width. -->
    <div data-site-header></div>

    <!-- One shell for every demo: the component in the middle, the fixtures beside it and always in view. See harness.js. -->
    <section
      class="showcase"
      dir="ltr"
      x-data="harness({
        mocks: 'vehicle-lookup',
        // A VIN with no warranty draws an empty rail, so it is not worth offering here.
        has: vehicle => Boolean(vehicle?.warranty),
        labels: {
          ZU8PC1Z95PP935130: 'multiple warranties',
          ZU95VW7N9PL234530: 'awaiting activation',
          ZT9T1XG12PT901120: 'awaiting activation, unauthorized',
          ZU99J61K7PZ167712: 'distributor possession',
          ZW9V34J06PY398057: 'broker, un-invoiced',
        },
      })"
    >
      <!-- The brief: title above the component, the about text below it — and one block floating beside it on a wide screen. -->
      <div class="showcase-brief">
        <header class="showcase-title flex flex-wrap items-baseline gap-x-3 gap-y-1 wide:flex-col wide:items-start">
          <h1 class="text-2xl font-bold tracking-tight">Warranty timeline</h1>
          <p class="eyebrow text-neutral">adp-web-components · vehicle lookup</p>
        </header>

        <!-- What the page demonstrates, beside the demo rather than above it: the component is what the page is for. -->
        <aside class="showcase-about border-base-300 border-t border-dashed pt-5 wide:mt-5 wide:border-t-0 wide:pt-0">
          <p class="eyebrow text-neutral">About this page</p>
          <p class="lede text-base-content/70 mt-2 text-sm">
            Every warranty the vehicle carries, drawn against one shared date axis. The interesting fixtures are the ones with more than one contract, or with none yet in force.
          </p>
        </aside>
      </div>

      <!-- Generated fixtures, beside the component and always in view. -->
      <div data-harness-fixtures class="showcase-fixtures" x-cloak></div>

      <!-- Only the stage follows the language control; the shell around it stays put. -->
      <div class="showcase-stage" :dir="dir">
        <div class="frame card bg-base-100 border-base-300 border p-5">
          <vehicle-warranty-timeline id="subject" language="en" query-string=""></vehicle-warranty-timeline>
        </div>
      </div>

      <!-- The harness drawer: launcher, right-edge hover strip and panel, all stamped by harness.js. -->
      <div data-harness-rail x-cloak></div>
    </section>
  </body>
</html>
