<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>General inquiry — adp-web-components</title>

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Blocking on purpose: a deferred module would let the page paint light first. -->
    <script src="/templates/harness-theme.js"></script>

    <script nomodule src="/build/shift-components.js"></script>
    <script type="module" src="/build/shift-components.esm.js"></script>

    <script type="module" src="/templates/harness.js"></script>
    <script defer src="/templates/vendor/alpine.js"></script>

    <!-- The host's fonts, loaded the way the host loads them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet" />

    <style>
      /*
       * This page has no host stylesheet to link — the host theme IS this block,
       * written locally so the `::part()` surface can be read next to the result.
       * `theme="test"` on the element is what names the outer part.
       *
       * The `!important` is one of the three sanctioned uses (R11): the component
       * sets the same property on the same part.
       */
      general-inquiry-form::part(general-inquiry-test) {
        margin: 32px 0;
        user-select: none;
        font-family: 'Noto Kufi Arabic', 'Nunito', Roboto, Arial, sans-serif !important;
      }

      general-inquiry-form::part(container) {
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 700px;
        margin-inline: auto;
      }

      general-inquiry-form::part(inputs_wrapper) {
        display: flex;
        flex-direction: column;
        gap: 24px;
        margin-bottom: 24px;
      }

      @media (min-width: 640px) {
        general-inquiry-form::part(inputs_wrapper) {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>

  <body class="bg-base-200 text-base-content min-h-screen">
    <!-- Every area and page, read from catalog.json. -->
    <div data-harness-nav x-cloak></div>

    <div class="mx-auto flex max-w-[1180px] flex-col gap-8 px-4 py-10 sm:px-8">
      <header>
        <p class="eyebrow text-neutral">adp-web-components · forms</p>
        <h1 class="mt-1 text-2xl font-bold tracking-tight">General inquiry</h1>
        <p class="lede text-base-content/70 mt-2">
          A contact form themed entirely from outside the component, through <code>::part()</code>. It is also the reference for submitting from a host button:
          <code>formReadyCallback</code> says when the structure has loaded, and <code>submit()</code> does the rest.
        </p>
      </header>

      <section class="flex flex-col gap-4" x-data="harness({ profile: 'form' })">
        <div class="flex min-w-0 flex-col gap-4">
          <!-- Mode + fixtures, right where they are used. -->
          <div data-harness-bar x-cloak></div>

          <div class="frame card bg-base-100 border-base-300 border p-5 sm:p-8">
            <!-- No `language` attribute: unset, the form resolves it from `?lang=`, which the rail keeps in sync. -->
            <general-inquiry-form
              id="subject"
              theme="test"
              disable-scroll-to-top="true"
              structure-url="https://adpstoragev2.blob.core.windows.net/tca-website/general-inquiry-form-structure.json?sv=2023-01-03&spr=https&st=2025-12-21T13%3A38%3A17Z&se=2999-12-22T13%3A38%3A00Z&sr=c&sp=rl&sig=pqiRRUA6hG83bVXVX6rBUtK24D2KkWsnztQ6RNk1fUc%3D"
            ></general-inquiry-form>
          </div>

          <!-- The host's button, outside the component, driving the public submit(). -->
          <button type="button" class="btn btn-primary btn-lg self-center" :disabled="!ready || loading" @click="submit()">
            <span class="loading loading-spinner loading-sm" x-show="loading"></span>
            <span x-text="ready ? 'Submit from the host page' : 'Waiting for the structure…'"></span>
          </button>
        </div>

        <!-- The harness drawer: launcher, right-edge hover strip and panel, all stamped by harness.js. -->
        <div data-harness-rail x-cloak></div>
      </section>
    </div>
  </body>
</html>
