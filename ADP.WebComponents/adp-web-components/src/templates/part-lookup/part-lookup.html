<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Part lookup — adp-web-components</title>

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Blocking on purpose: a deferred module would let the page paint light first. -->
    <script src="/templates/harness-theme.js"></script>

    <script nomodule src="/build/shift-components.js"></script>
    <script type="module" src="/build/shift-components.esm.js"></script>

    <script type="module" src="/templates/harness.js"></script>
    <script defer src="/templates/vendor/alpine.js"></script>
  </head>

  <body class="bg-base-200 text-base-content min-h-screen">
    <!-- Every area and page, read from catalog.json. -->
    <div data-harness-nav x-cloak></div>

    <div class="mx-auto flex max-w-[1400px] flex-col gap-8 px-4 py-10 sm:px-8">
      <header>
        <p class="eyebrow text-neutral">adp-web-components · part lookup</p>
        <h1 class="mt-1 text-2xl font-bold tracking-tight">Part lookup</h1>
        <p class="lede text-base-content/70 mt-2">
          The wrapper that holds all three part lookups and shows one at a time. The search field and tab strip below are the host's — they are what a page embedding this component
          has to build, and they drive <code>fetchData()</code> and <code>active-element</code>.
        </p>
      </header>

      <section
        class="flex flex-col gap-4"
        x-data="harness({
          profile: 'part',
          samples: ['T110715002102', 'T1118850010/1', 'T1112375020/11'],
          setup: subject => (subject.endpoint = { url: 'https://tiq-part-lookup.azurewebsites.net/api/secure-part-lookup', query: { code: '' } }),
        })"
      >
        <div class="flex min-w-0 flex-col gap-4">
          <!--
            Host-side chrome, not harness chrome: a real embedding page owns the
            search field and the tab strip, so they stay in the page body rather
            than moving into the rail.
          -->
          <div class="card bg-base-100 border-base-300 flex flex-wrap items-center gap-3 border p-4" x-data="{ code: 'SU00302474' }">
            <label class="input min-w-60 flex-1">
              <span class="eyebrow text-neutral">Part no.</span>
              <input x-model="code" type="search" placeholder="e.g. SU00302474" aria-label="Part number" @keydown.enter.prevent="run(code)" />
            </label>

            <button type="button" class="btn btn-primary" :disabled="loading" @click="run(code)">
              <span class="loading loading-spinner loading-xs" x-show="loading"></span>
              Search
            </button>
          </div>

          <div role="tablist" class="tabs tabs-box self-start" x-data="{ tab: 'distributor-lookup' }">
            <template
              x-for="item in [
                { value: 'dead-stock-lookup', label: 'Dead stock' },
                { value: 'distributor-lookup', label: 'Distributor' },
                { value: 'manufacturer-lookup', label: 'Manufacturer' },
              ]"
              :key="item.value"
            >
              <button
                type="button"
                role="tab"
                class="tab"
                :class="tab === item.value && 'tab-active'"
                :aria-selected="tab === item.value"
                @click="tab = item.value; subject.activeElement = item.value"
                x-text="item.label"
              ></button>
            </template>
          </div>

          <!-- Mode + fixtures, right where they are used. -->
          <div data-harness-bar x-cloak></div>

          <div class="frame card bg-base-100 border-base-300 border p-5">
            <part-lookup id="subject" language="en" active-element="distributor-lookup"></part-lookup>
          </div>
        </div>

        <!-- The harness drawer: launcher, right-edge hover strip and panel, all stamped by harness.js. -->
        <div data-harness-rail x-cloak></div>
      </section>
    </div>
  </body>
</html>
