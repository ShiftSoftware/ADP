<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Part lookup — adp-web-components</title>
    <link rel="icon" href="/templates/assets/favicon.svg" type="image/svg+xml" />

    <meta name="adp-publish" content="true" />

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Both blocking on purpose: theme and text direction are decided before the first paint, or the page visibly jumps. -->
    <script src="/templates/harness-theme.js"></script>
    <script src="/templates/site-locales.js"></script>

    <script nomodule src="/build/shift-components.js"></script>
    <script type="module" src="/build/shift-components.esm.js"></script>

    <script type="module" src="/templates/harness.js"></script>
    <script defer src="/templates/vendor/alpine.js"></script>
  </head>

  <body class="wide-column bg-base-200 text-base-content min-h-screen">
    <!-- The site header, the same one the home page has; harness.js mounts it at the shell's width. -->
    <div data-site-header></div>

    <!-- One shell for every demo: the component gets the column in full, and the column is a wide one. See harness.js. -->
    <section
      class="showcase"
      dir="ltr"
      x-data="harness({
        profile: 'part',
        mocks: 'part-lookup',
      })"
    >
      <!-- The brief: a one-line title above the component, the about text below it. -->
      <div class="showcase-brief">
        <header class="showcase-title flex flex-wrap items-baseline gap-x-3 gap-y-1">
          <h1 class="text-lg font-bold tracking-tight">Part lookup</h1>
          <p class="eyebrow text-neutral">adp-web-components · part lookup</p>
        </header>

        <!-- What the page demonstrates, beside the demo rather than above it: the component is what the page is for. -->
        <aside class="showcase-about border-base-300 border-t border-dashed pt-5">
          <p class="eyebrow text-neutral">About this page</p>
          <p class="lede text-base-content/70 mt-2 text-sm">
            The wrapper that holds all three part lookups and shows one at a time. The search field and tab strip above are the host's — they are what a page embedding this
            component has to build, and they drive <code>fetchData()</code> and <code>active-element</code>.
          </p>
        </aside>
      </div>

      <!-- Only the stage follows the language control; the shell around it stays put. -->
      <div class="showcase-stage flex flex-col gap-3" :dir="dir">
        <!--
          Host-side chrome, not harness chrome: a real embedding page owns the
          search field and the tab strip, so they stay in the page body rather
          than moving into the rail.
        -->
        <!--
          A fixture is a search like any other: picking one fills the field and
          runs it, so the field always shows the number the component was asked
          for. It starts empty — the chips below it are the examples.
        -->
        <div class="card bg-base-100 border-base-300 flex flex-col gap-2 border p-3" x-data="{ code: '' }" x-init="$watch('fixture', key => { if (key !== null) code = key })">
          <div class="flex flex-wrap items-center gap-2">
            <label class="input input-sm min-w-60 flex-1">
              <span class="eyebrow text-neutral">Part no.</span>
              <input x-model="code" type="search" placeholder="Type a part number, or pick one below" aria-label="Part number" @keydown.enter.prevent="run(code)" />
            </label>

            <button type="button" class="btn btn-sm btn-primary" :disabled="loading" @click="run(code)">
              <span class="loading loading-spinner loading-xs" x-show="loading"></span>
              Search
            </button>
          </div>

          <!-- Generated fixtures, under the field they fill: harness chrome inside the host's panel, so a dashed rule marks where one ends. -->
          <div data-harness-fixtures class="border-base-300 border-t border-dashed pt-2" x-cloak></div>
        </div>

        <div role="tablist" class="tabs tabs-box tabs-sm self-start" x-data="{ tab: 'distributor-lookup' }">
          <template
            x-for="item in [
              { value: 'dead-stock-lookup', label: 'Dead stock' },
              { value: 'distributor-lookup', label: 'Distributor' },
              { value: 'manufacturer-lookup', label: 'Manufacturer' },
            ]"
            :key="item.value"
          >
            <button
              type="button"
              role="tab"
              class="tab"
              :class="tab === item.value && 'tab-active'"
              :aria-selected="tab === item.value"
              @click="tab = item.value; subject.activeElement = item.value"
              x-text="item.label"
            ></button>
          </template>
        </div>

        <div class="frame card bg-base-100 border-base-300 border p-5">
          <part-lookup id="subject" language="en" active-element="distributor-lookup"></part-lookup>
        </div>
      </div>

      <!-- The harness drawer: launcher, right-edge hover strip and panel, all stamped by harness.js. -->
      <div data-harness-rail x-cloak></div>
    </section>
  </body>
</html>
