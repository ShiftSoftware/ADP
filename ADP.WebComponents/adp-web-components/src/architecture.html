<!doctype html>
<!--
  How it fits together — the architecture page for adp-web-components.

  The whole chain in one picture: the systems the data comes from, ADP on the
  Shift Framework, Lookup Services, this package, and the pages it lands on.
  It lived on the landing page as its own section, with the four-step prose and
  an illustration under it — the same story three times and a screen and a half
  of it, on a page whose job is to get an integrator to the quickstart. The
  landing page keeps a four-line teaser and links here.

  Same chrome as the landing page: templates/site-header.js stamps the top bar,
  the copy is in templates/site-locales.js in four languages, and the section
  bands alternate bg-base-100 / bg-base-200 below the wash header exactly as
  index.html does — position decides the colour, not content.

  Nothing user-visible is written in this file. Hrefs are not copy, so the
  "Go deeper" targets live in the page script, index-aligned with the list they
  label, the way SUPPORT_LINKS does on the landing page.
-->
<html lang="en" dir="ltr" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>How it fits together — ADP web components</title>
    <meta
      name="description"
      content="Where adp-web-components sits: dealer and distributor systems, the Auto Distributor Platform on the Shift Framework, the Lookup Services, and the pages the elements land on — one picture of the whole chain."
    />

    <!-- Static, in English, on purpose — a link-preview scraper does not run Alpine. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="How it fits together — ADP web components" />
    <meta property="og:description" content="Where adp-web-components sits between the Auto Distributor Platform, the Shift Framework and your page." />
    <!-- A PNG, and 1200×630: link-preview scrapers do not render SVG, and a
         relative path is discarded outright — the release build makes it
         absolute once it knows the site URL. -->
    <meta property="og:image" content="templates/assets/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="How it fits together — ADP web components" />
    <meta name="twitter:description" content="Where adp-web-components sits between the Auto Distributor Platform, the Shift Framework and your page." />

    <link rel="icon" href="/templates/assets/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1016" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" href="/templates/harness.css" />

    <!-- Both blocking on purpose: theme and text direction are decided before the
         first paint, or the page visibly jumps on every load. -->
    <script src="/templates/harness-theme.js"></script>
    <script src="/templates/site-locales.js"></script>

    <!--
      The top bar, mounted ahead of Alpine — see the same block in index.html for
      why the order matters and why this is a module while the page script below
      is not. alpineScope: false because architecture() covers the header: the
      :inert on <main> and <footer> reads the header's own `mobile`.
    -->
    <script type="module">
      import { mountSiteHeader } from './templates/site-header.js';

      mountSiteHeader({ alpineScope: false });
    </script>

    <script defer src="/templates/vendor/alpine.js"></script>
  </head>

  <body class="bg-base-200 text-base-content min-h-screen">
    <!-- No x-cloak here either: the page must render for a client without JavaScript. -->
    <div x-data="architecture()" @keydown.escape.window="open = null; mobile = false">
      <a href="#main" class="btn btn-primary sr-only focus:not-sr-only focus:absolute focus:start-3 focus:top-3 focus:z-50" x-text="t('skip')"></a>

      <!-- ═══════════════════════════ top bar ═══════════════════════════ -->
      <div data-site-header>
        <!-- Placeholder; templates/site-header.js replaces this element outright. -->
      </div>

      <main id="main" tabindex="-1" :inert="mobile">
        <!-- ═══════════════════════════ 1 · title ═══════════════════════════ -->
        <section class="wash border-base-300 relative overflow-hidden border-b [--wash-reach:100%]">
          <span
            class="adp-logo pointer-events-none absolute -top-10 end-[-6rem] w-[560px] text-[color-mix(in_srgb,var(--color-primary)_var(--watermark-strength),transparent)] sm:w-[720px]"
            aria-hidden="true"
          ></span>

          <div class="relative mx-auto w-full max-w-[1240px] px-5 py-14 sm:px-8 sm:py-20">
            <p class="eyebrow text-accent rise font-bold" x-text="t('architecture.eyebrow')"></p>
            <h1 class="rise rise-2 mt-4 text-4xl leading-[var(--leading-display)] font-bold tracking-tight sm:text-5xl" x-text="t('architecture.title')"></h1>
            <p class="lede text-base-content/70 rise rise-3 mt-5 text-lg leading-relaxed sm:text-xl" x-text="t('architecture.lede')"></p>
          </div>
        </section>

        <!-- ═══════════════════════════ 2 · the chain ═══════════════════════════ -->
        <section class="bg-base-100 border-base-300 border-b">
          <div class="mx-auto max-w-[1240px] px-5 py-16 sm:px-8 sm:py-20">
            <!--
              The whole chain as native markup, not an image: the strings go through
              t() like every other line on the site, the direction follows the
              document, the colours are the theme's, and on a phone the layers stack
              instead of scrolling sideways. The mkdocs site shows the same chart as a
              static SVG (English only). Product names stay as they are in every
              language; everything else is translated. No heading of its own — the
              page's title is the caption.
            -->
            <div class="flex flex-col">
              <!-- 1 · the systems the data comes from -->
              <div class="card bg-base-100 border-base-300 border p-5 sm:p-6">
                <div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-3">
                  <div class="min-w-0">
                    <p class="text-lg font-bold" x-text="t('chart.sources').title"></p>
                    <p class="text-base-content/70 mt-1 text-sm leading-relaxed" x-text="t('chart.sources').body"></p>
                  </div>
                  <ul class="flex flex-wrap gap-2">
                    <template x-for="chip in t('chart.sources').chips" :key="chip">
                      <li class="badge badge-outline badge-sm" x-text="chip"></li>
                    </template>
                  </ul>
                </div>
              </div>

              <div class="flex items-center gap-3 py-1.5 ps-5">
                <svg viewBox="0 0 12 36" class="text-base-content/40 h-9 w-3 shrink-0" fill="none" aria-hidden="true">
                  <path d="M6 0v27" stroke="currentColor" stroke-width="1.5" />
                  <path d="M1 26l5 9 5-9z" fill="currentColor" />
                </svg>
                <p class="text-sm">
                  <span class="eyebrow text-accent font-bold" x-text="t('chart.sync').label"></span>
                  <span class="text-base-content/70 ms-1" x-text="t('chart.sync').note"></span>
                </p>
              </div>

              <!-- 2 · the platform, standing on the framework -->
              <div class="bg-base-200 border-base-300 rounded-3xl border p-4 sm:p-5">
                <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-2">
                  <span class="badge badge-primary badge-lg font-bold" x-text="t('chart.adp').title"></span>
                  <span class="text-base-content/60 text-xs" x-text="t('chart.adp').note"></span>
                </div>

                <div class="mt-4 grid gap-3 md:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)_auto_minmax(0,1fr)] md:gap-2">
                  <template x-for="(stage, index) in t('chart.pipeline')" :key="stage.name">
                    <div class="contents">
                      <div class="card bg-base-100 border-base-300 border p-5">
                        <p class="text-base font-bold" x-text="stage.name"></p>
                        <span class="badge badge-outline badge-sm mt-2 w-fit" x-text="stage.chip"></span>
                        <ul class="mt-4 flex flex-col gap-1 text-sm font-medium">
                          <template x-for="fact in stage.facts" :key="fact">
                            <li x-text="fact"></li>
                          </template>
                        </ul>
                        <p class="text-base-content/70 mt-2 text-sm leading-relaxed" x-text="stage.body"></p>
                      </div>
                      <!-- between stages: across on wide screens, down on narrow ones -->
                      <div x-show="index < t('chart.pipeline').length - 1" class="flex items-center justify-center gap-2 md:flex-col md:px-1" aria-hidden="true">
                        <svg viewBox="0 0 36 12" class="text-base-content/40 h-3 w-9 rotate-90 md:rotate-0 rtl:md:-scale-x-100" fill="none">
                          <path d="M0 6h27" stroke="currentColor" stroke-width="1.5" />
                          <path d="M26 1l9 5-9 5z" fill="currentColor" />
                        </svg>
                        <span class="eyebrow text-accent font-bold" x-text="t('chart.pipelineArrows')[index]"></span>
                      </div>
                    </div>
                  </template>
                </div>

                <div class="bg-base-100 border-primary mt-4 rounded-2xl border border-s-4 p-4 sm:p-5">
                  <div class="flex flex-wrap items-baseline justify-between gap-x-6 gap-y-1">
                    <p class="text-base font-bold" x-text="t('chart.framework').title"></p>
                    <span class="text-base-content/60 text-xs" x-text="t('chart.framework').note"></span>
                  </div>
                  <p class="text-base-content/70 mt-1 text-sm leading-relaxed" x-text="t('chart.framework').body"></p>
                </div>
              </div>

              <div class="flex items-center gap-3 py-1.5 ps-5">
                <svg viewBox="0 0 12 36" class="text-base-content/40 h-9 w-3 shrink-0" fill="none" aria-hidden="true">
                  <path d="M6 0v27" stroke="currentColor" stroke-width="1.5" />
                  <path d="M1 26l5 9 5-9z" fill="currentColor" />
                </svg>
                <p class="text-sm">
                  <span class="eyebrow text-accent font-bold" x-text="t('chart.https').label"></span>
                  <span class="text-base-content/70 ms-1" x-text="t('chart.https').note"></span>
                </p>
              </div>

              <!-- 3 · this package -->
              <div class="card bg-base-100 border-primary relative overflow-hidden border-2 p-5 sm:p-6">
                <span class="bg-primary absolute inset-x-0 top-0 h-1.5" aria-hidden="true"></span>
                <div class="flex flex-wrap items-center gap-3">
                  <p class="text-lg font-bold" x-text="t('chart.elements').title"></p>
                  <span class="badge badge-outline badge-sm" x-text="t('chart.elements').chip"></span>
                </div>
                <p class="text-base-content/70 mt-2 text-sm leading-relaxed" x-text="t('chart.elements').body"></p>
                <div class="mt-4 flex flex-wrap items-center justify-between gap-x-6 gap-y-3">
                  <ul class="flex flex-wrap gap-2">
                    <template x-for="family in t('chart.elements').families" :key="family">
                      <li class="badge badge-ghost font-semibold" x-text="family"></li>
                    </template>
                  </ul>
                  <p class="text-base-content/60 text-xs" x-text="t('chart.elements').note"></p>
                </div>
              </div>

              <div class="flex items-center gap-3 py-1.5 ps-5">
                <svg viewBox="0 0 12 36" class="text-base-content/40 h-9 w-3 shrink-0" fill="none" aria-hidden="true">
                  <path d="M6 0v27" stroke="currentColor" stroke-width="1.5" />
                  <path d="M1 26l5 9 5-9z" fill="currentColor" />
                </svg>
                <p class="text-sm">
                  <span class="eyebrow text-accent font-bold" x-text="t('chart.embed').label"></span>
                  <span class="text-base-content/70 ms-1" x-text="t('chart.embed').note"></span>
                </p>
              </div>

              <!-- 4 · the pages it lands on: four, because "anywhere" is shown, not claimed -->
              <ul class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                <template x-for="host in t('chart.hosts')" :key="host.name">
                  <li class="card bg-base-100 border-base-300 border p-4">
                    <p class="font-bold" x-text="host.name"></p>
                    <p class="text-base-content/70 mt-1 text-sm" x-text="host.body"></p>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </section>

        <!-- ═══════════════════════════ 3 · layer by layer ═══════════════════════════ -->
        <section class="bg-base-200 border-base-300 border-b">
          <div class="mx-auto max-w-[1240px] px-5 py-16 sm:px-8 sm:py-20">
            <h2 class="text-2xl leading-[var(--leading-heading)] font-bold tracking-tight" x-text="t('architecture.layers')"></h2>
            <p class="lede text-base-content/70 mt-3" x-text="t('architecture.layersLede')"></p>

            <div class="mt-12 grid gap-12 lg:grid-cols-[minmax(0,1.3fr)_minmax(0,1fr)] lg:items-center">
              <ol class="border-accent/50 ms-4 flex flex-col border-s-2">
                <template x-for="(item, index) in list('stack.items')" :key="item.name">
                  <li class="relative ps-8 pb-8 last:pb-0">
                    <!-- -ms-3.5 is half of w-7, as a LOGICAL offset. translateX(-50%)
                         is physical: it shifts left in both directions, so under RTL
                         it covered a letter of every step heading. -->
                    <span
                      class="bg-primary text-primary-content absolute start-0 top-0 -ms-3.5 flex h-7 w-7 items-center justify-center rounded-full text-xs font-bold tabular-nums"
                      x-text="index + 1"
                    ></span>
                    <p class="text-base font-semibold" x-text="item.name"></p>
                    <p class="text-base-content/70 mt-1 max-w-[62ch] text-[15px] leading-relaxed" x-text="item.body"></p>
                  </li>
                </template>
              </ol>

              <svg viewBox="0 0 280 250" fill="none" class="hidden h-auto w-full max-w-[340px] justify-self-center lg:block" aria-hidden="true">
                <g class="text-base-300" stroke="currentColor" stroke-width="2">
                  <rect x="20" y="12" width="240" height="46" rx="10" />
                  <rect x="32" y="76" width="216" height="46" rx="10" />
                  <rect x="68" y="204" width="144" height="38" rx="10" />
                </g>
                <rect x="44" y="140" width="192" height="46" rx="10" class="text-primary" fill="currentColor" opacity=".14" />
                <rect x="44" y="140" width="192" height="46" rx="10" class="text-accent" stroke="currentColor" stroke-width="2.5" />
                <g class="text-base-content/35" fill="currentColor">
                  <rect x="38" y="30" width="96" height="10" rx="5" />
                  <rect x="50" y="94" width="76" height="10" rx="5" />
                  <rect x="86" y="218" width="58" height="10" rx="5" />
                </g>
                <rect x="62" y="158" width="112" height="10" rx="5" class="text-accent" fill="currentColor" />
                <g class="text-base-300" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7">
                  <path d="M140 58v18M140 122v18M140 186v18" />
                </g>
              </svg>
            </div>
          </div>
        </section>

        <!-- ═══════════════════════════ 4 · go deeper ═══════════════════════════ -->
        <section class="bg-base-100">
          <div class="mx-auto max-w-[1240px] px-5 py-16 sm:px-8 sm:py-20">
            <h2 class="text-2xl leading-[var(--leading-heading)] font-bold tracking-tight" x-text="t('architecture.more')"></h2>
            <p class="lede text-base-content/70 mt-3" x-text="t('architecture.moreLede')"></p>

            <ul class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
              <template x-for="(item, index) in list('architecture.links')" :key="item.name">
                <li>
                  <a
                    class="card bg-base-200 border-base-300 hover:border-accent/60 flex h-full flex-col gap-2 border p-6 transition-colors"
                    :href="link(index)"
                    target="_blank"
                    rel="noreferrer"
                  >
                    <p class="flex items-center gap-1.5 font-semibold">
                      <span x-text="item.name"></span>
                      <span class="text-accent rtl:-scale-x-100" aria-hidden="true">→</span>
                    </p>
                    <p class="text-base-content/70 text-sm leading-relaxed" x-text="item.body"></p>
                  </a>
                </li>
              </template>
            </ul>
          </div>
        </section>
      </main>

      <footer class="bg-base-200 wash wash-up border-base-300 border-t [--wash-reach:100%]" :inert="mobile">
        <div class="mx-auto flex max-w-[1240px] flex-wrap items-center gap-x-4 gap-y-3 px-5 py-10 sm:px-8">
          <span class="bg-primary flex items-center justify-center rounded-lg px-2 py-1.5">
            <span class="adp-logo text-primary-content h-3.5 w-[36px]" aria-hidden="true"></span>
          </span>
          <p class="text-base-content/70 text-sm" x-text="t('footer.tagline')"></p>
          <!-- <bdi dir="ltr">: see the same line in index.html — the @ takes the
               paragraph direction otherwise and the token renders reversed. -->
          <p class="text-base-content/65 ms-auto font-mono text-xs" x-show="version">
            <span x-text="t('footer.built')"></span>
            <bdi dir="ltr" x-text="packageName + '@' + version"></bdi>
          </p>
        </div>
      </footer>
    </div>

    <script>
      /* Index-aligned with architecture.links. Hrefs are presentation, not copy. */
      const ARCHITECTURE_LINKS = [
        'https://adp-docs.shift.software/',
        'https://docs.shift.software/',
        'https://adp-docs.shift.software/generated/LookupServices/DTOsAndModels/VehicleLookup/VehicleLookupDTO.html',
        'https://adp-docs.shift.software/generated/LookupServices/DTOsAndModels/Part/PartLookupDTO.html',
      ];

      /*
       * The page state, built on top of the header's — the same shape as
       * landing() in index.html, with only what this page adds. siteHeader() is
       * on window because this is a classic script and cannot import.
       */
      function architecture() {
        return window.siteHeader({
          /** Lists are arrays, not strings, so they bypass `t`'s string fallback. */
          list(key) {
            const value = window.siteLocales.t(this.language, key);

            return Array.isArray(value) ? value : [];
          },

          get packageName() {
            return this.catalog.package?.name ?? 'adp-web-components';
          },

          link(index) {
            return ARCHITECTURE_LINKS[index] ?? null;
          },
        });
      }
    </script>
  </body>
</html>
