trigger:
  tags:
    include:
      - release-web-components-*

variables:
  - group: Deployment

steps:
  - task: UseNode@1
    inputs:
      version: '22.x'
      checkLatest: false
    displayName: 'Set up Node.js'

  - task: Npm@1
    displayName: 'Install dependencies'
    inputs:
      command: 'custom'
      workingDir: 'ADP.WebComponents/adp-web-components'
      customCommand: 'install --ignore-scripts'

  - task: Npm@1
    displayName: 'Build the project'
    inputs:
      command: 'custom'
      customCommand: 'run build'
      workingDir: 'ADP.WebComponents/adp-web-components'

  - task: Npm@1
    displayName: 'Publish to npm'
    condition: and(succeeded(), contains(variables['Build.SourceBranch'], 'refs/tags/release'))
    inputs:
      command: 'publish'
      workingDir: 'ADP.WebComponents/adp-web-components'
      publishEndpoint: 'NPM'

  - script: node -e "setTimeout(() => {}, 10000)"
    displayName: 'Wait for npm registry propagation'
    condition: and(succeeded(), contains(variables['Build.SourceBranch'], 'refs/tags/release'))

  - task: Npm@1
    displayName: 'Purge jsDelivr CDN cache'
    condition: and(succeeded(), contains(variables['Build.SourceBranch'], 'refs/tags/release'))
    continueOnError: true
    retryCountOnTaskFailure: 2
    inputs:
      command: 'custom'
      customCommand: 'run purge'
      workingDir: 'ADP.WebComponents/adp-web-components'
